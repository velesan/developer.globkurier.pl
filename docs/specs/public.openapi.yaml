        '404':
          $ref: '#/components/responses/NotFound'
  /v1/user/address:
    put:
      operationId: userUpdateAddress
      tags:
      - User
      summary: Update the current user's address
      description: 'Updates only the account address. Uses the same validation as `PUT /v1/user`.

        - `address.type` is forced to the current account type when one is already set (the sent value is ignored).

        - `address.countryId` defaults to the current country and cannot be changed once the account type is set.

        - A changed `address.phone` requires `verificationCode` (6-digit SMS code sent to the new number); on success the
        phone is marked verified.

        - Side effect: the invoice currency is reset to `PLN`, because this endpoint does not accept `currency`.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAddressUpdateRequest'
            example:
              address:
                type: PERSON
                name: Jan
                surname: Kowalski
                street: Testowa
                houseNumber: '1'
                postCode: 00-001
                city: Warszawa
                phone: '+48500000000'
                email: jan.kowalski@example.com
              verificationCode: '123456'
      responses:
        '204':
          description: Address saved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/user/addressBook:
    get:
      operationId: userSearchAddressBook
      tags:
