      security:
      - {}
      - tokenAuth: []
    put:
      operationId: integrationAllegroUpdateAccount
      tags:
      - Integrations
      summary: Update an Allegro integration
      description: 'Updates configuration of the caller''s Allegro integration (also used by the panel to switch it on/off
        with `{"status": false}`). The body is forwarded to hermes-2 as is; empty `statusAfterFetch` / `statusAfterCompletion`
        are dropped instead of being sent as empty. Ownership is checked as in GET.'
      x-unverified: true
      parameters:
