  /v1/complaints/statistics:
    get:
      operationId: complaintGetStatisticsR01
      tags:
      - Complaints
      summary: Complaint KPIs of the logged-in user
      description: 'Complaint statistics of the logged-in user (matched by account e-mail, visible complaints only): number
        of open

        complaints, complaints past the carrier deadline (SLA breached), average closing time in Polish working days

        within the last `closedWithinDays` days (complaints with an estimated closing date are excluded), number of

        those closed complaints and counts per status group (every group is always present, `0` when empty).

        '
      x-proxied-to: /public/v2/complaints/statistics
      parameters:
      - name: closedWithinDays
        in: query
        required: false
        description: Window for the average closing time, whole number of days.
        schema:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
      responses:
        '200':
          description: Statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintStatisticsV2'
              example:
                open: 3
                slaBreached: 1
                averageClosingWorkingDays: 11.4
                closedCount: 5
                byGroup:
                  VERIFICATION: 1
                  MISSING_DOCUMENTS: 1
                  AT_CARRIER: 1
                  APPEAL: 0
                  ACCEPTED: 3
                  REJECTED: 1
                  CLOSED: 1
                  INTERVENTION: 0
                  UNKNOWN: 0
        '400':
          description: '`closedWithinDays` is not a whole number between 1 and 365.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
              example:
                fields:
                  closedWithinDays: Must be a whole number between 1 and 365.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/complaints/{complaintNumber}/documents:
    get:
      operationId: complaintListDocumentsR01
      tags:
      - Complaints
      summary: List documents the client uploaded to a complaint
      description: 'Lists only the documents the CLIENT uploaded (via `POST /v1/complaints/{complaintNumber}/documents`).

        Attachments added by GlobKurier staff in Zoho are returned by `GET /v1/zoho/cases` in `Attachments`.

        The complaint must belong to the logged-in user (checked in Zoho); otherwise `404`.

        '
      x-proxied-to: /public/v2/complaints/{complaintNumber}/documents
      parameters:
      - name: complaintNumber
        in: path
        required: true
        description: Internal complaint number (`Numer_wen_reklamacji` in Zoho).
        schema:
          type: string
        example: Rek000000
      responses:
        '200':
          description: Documents of the complaint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDocumentListV2'
              example:
                results:
                - id: 123
                  fileName: protocol.pdf
                  size: 482134
                  mimeType: application/pdf
                  createdAt: '2026-08-20T14:12:00+02:00'
                  linked: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Complaint does not exist or does not belong to the user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
              example:
                error: Complaint not found.
        '503':
          description: The complaint could not be looked up in Zoho.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
              example:
                error: Temporarily unavailable.
    post:
      operationId: complaintUploadDocumentR01
      tags:
      - Complaints
      summary: Upload a document to a complaint
      description: 'Uploads one file (`multipart/form-data`, field `file`) to a complaint of the logged-in user. gk rebuilds
        the

        multipart request (`redirectWithUpload`) and forwards only `x-auth-token` and `accept-language`; a request without

        a valid `file` part is refused by gk itself with `400`.

        The file type is detected from the CONTENT (finfo), not from the extension. Allowed: PDF, JPEG, PNG, HEIC, TIFF,

        GIF, BMP, DOC, DOCX, XLS, XLSX, CSV, TXT; max 10 MB per file, max 15 files and 100 MB per complaint.

        Uploading a file identical to one already stored (sha256) returns `200` with the existing document and

        `duplicate: true` instead of `201`. `linked: false` means the CRM link is still being completed.

        '
      x-proxied-to: /public/v2/complaints/{complaintNumber}/documents
      parameters:
      - name: complaintNumber
        in: path
        required: true
        description: Internal complaint number (`Numer_wen_reklamacji` in Zoho).
        schema:
          type: string
        example: Rek000000
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ComplaintDocumentUploadRequestV2'
      responses:
        '201':
          description: Document stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDocumentV2'
              example:
                id: 123
                fileName: protocol.pdf
                size: 482134
                mimeType: application/pdf
                createdAt: '2026-08-20T14:12:00+02:00'
                linked: true
        '200':
          description: 'The same file was already uploaded to this complaint; the existing document is returned with `duplicate:
            true`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintDocumentV2'
        '400':
          description: Missing file, forbidden format, file too large or description too long (messages in Polish).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
              example:
                fields:
                  file: Niedozwolony format pliku.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Complaint does not exist or does not belong to the user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
              example:
                error: Complaint not found.
        '409':
          description: Per-complaint file count or size limit reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
              example:
                error: Attachment limit reached.
        '422':
          description: Complaint is closed and does not accept documents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
              example:
                error: Complaint is closed.
        '503':
          description: Document storage not configured/unavailable or Zoho lookup failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
              example:
                error: Temporarily unavailable.
        '504':
          description: gk could not reach the v2 service in time (connect 5 s / total 120 s); the document may still have
            been stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
              example:
                general:
                - Document storage is temporarily unavailable.
  /v1/complaints/{complaintNumber}/documents/{documentId}:
    get:
      operationId: complaintDownloadDocumentR01
      tags:
      - Complaints
      summary: Download a document the client uploaded to a complaint
      description: 'Streams the stored file (fetched from Zoho WorkDrive by the backend; the WorkDrive link is never exposed).

        `Content-Type` is the type verified at upload. The complaint must belong to the logged-in user and the document

        must belong to the complaint; otherwise `404`. A non-numeric `documentId` returns `404` with an empty body.

        Note: gk passes only `Content-Type` through, so the `Content-Disposition` file name set by the v2 service is not

        delivered to the client - use `fileName` from the list endpoint.

        '
      x-proxied-to: /public/v2/complaints/{complaintNumber}/documents/{documentId}
      parameters:
      - name: complaintNumber
        in: path
        required: true
        description: Internal complaint number (`Numer_wen_reklamacji` in Zoho).
        schema:
          type: string
        example: Rek000000
      - name: documentId
        in: path
        required: true
        description: Document id from the list endpoint.
        schema:
          type: integer
          minimum: 1
        example: 123
      responses:
        '200':
          description: Binary content of the document.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Complaint not found / not owned, or document not found in this complaint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
              example:
                error: Document not found.
        '503':
          description: Zoho lookup or document storage unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
              example:
                error: Temporarily unavailable.
  /v1/complaints/{complaintNumber}/timeline:
    get:
      operationId: complaintGetTimelineR01
      tags:
      - Complaints
      summary: Timeline of a complaint
      description: 'Timeline of a complaint of the logged-in user (matched by account e-mail, visible complaints only): status

        group changes in order (consecutive Zoho statuses of one group collapsed into one event), sent escalations, the carrier

        dates and the days the carrier has left to answer. `exact: false` marks a first status known only from a later read -

        its date means "as of", not the moment the complaint got there.

        '
      x-proxied-to: /public/v2/complaints/{complaintNumber}/timeline
      parameters:
      - name: complaintNumber
        in: path
        required: true
        description: Internal complaint number (`Numer_wen_reklamacji` in Zoho).
        schema:
          type: string
        example: Rek000000
      responses:
        '200':
          description: Timeline.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintTimelineV2'
              example:
                complaintNumber: Rek000000
                module: Reklamacje_PSC
                statusGroup: AT_CARRIER
                carrier: DPD GZ
                createdAt: '2026-09-22T15:10:05+02:00'
                handedToCarrierAt: '2026-10-03T15:10:05+02:00'
                carrierDeadline: '2026-10-17T15:10:05+02:00'
                daysToCarrierDeadline: 5
                slaBreached: false
                slaOverdueDays: null
                closedAt: null
                closedAtEstimated: false
                events:
                - at: '2026-09-22T15:10:05+02:00'
                  type: STATUS
                  statusGroup: VERIFICATION
                  exact: false
                - at: '2026-10-03T15:10:05+02:00'
                  type: STATUS
                  statusGroup: AT_CARRIER
                  exact: true
                - at: '2026-10-09T15:10:05+02:00'
                  type: ESCALATION
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Complaint does not exist, is not visible or does not belong to the user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
              example:
                error: Complaint not found.
  /v1/complaints/{complaintNumber}/escalations:
    post:
      operationId: complaintCreateEscalationR01
      tags:
      - Complaints
      summary: Escalate a complaint
      description: 'Escalates an open complaint of the logged-in user: GlobKurier is notified by e-mail. The number of escalations

        per complaint is limited (`maxEscalations`). Body is optional; when sent it must be JSON.

        '
      x-proxied-to: /public/v2/complaints/{complaintNumber}/escalations
      parameters:
      - name: complaintNumber
        in: path
        required: true
        description: Internal complaint number (`Numer_wen_reklamacji` in Zoho).
        schema:
          type: string
        example: Rek000000
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComplaintEscalationRequestV2'
            example:
              message: The carrier has not answered for two weeks.
      responses:
        '201':
          description: Escalation sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComplaintEscalationResultV2'
              example:
                escalationCount: 1
                maxEscalations: 1
                escalationsRemaining: 0
        '400':
          description: '`message` is not text or longer than 1000 characters, or the JSON body is invalid.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
              example:
                fields:
                  message: Must be text of at most 1000 characters.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Complaint does not exist or does not belong to the user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
              example:
                error: Complaint not found.
        '409':
          description: Escalation limit reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
              example:
                error: Escalation limit reached.
        '422':
          description: Complaint is closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
              example:
                error: Complaint is closed.
        '503':
          description: Escalation disabled, e-mail not sent, Zoho lookup unavailable or the complaint is locked by a concurrent
            request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
              example:
                error: Temporarily unavailable.
