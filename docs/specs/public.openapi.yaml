        '200':
          description: States.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AddressStateV2'
              example:
              - id: 1
                code: AK
                isoCode: US-AK
                name: Alaska
                localName: Alaska
        '400':
          description: '`countryId` missing, not an integer, unknown or a country without states; unknown query parameter
            -> `general` string.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderProxyErrorV2'
              examples:
                missing:
                  value:
                    fields:
                      countryId: This value should not be blank.
                noStates:
