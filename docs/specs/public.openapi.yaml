  /v1/tradePlatform/allegro/account/startAddingProcess:
    post:
      operationId: tradePlatformAllegroStartAdding
      tags:
      - Trade Platforms
      summary: Start adding an Allegro account
      description: 'Starts linking an Allegro account via OAuth 2.0. Intended as a browser form POST: the response is a redirect
        to the

        Allegro authorization page, with process cookies (15 min) for the callback. The GlobKurier API token is passed in
        the

        body, not in the header. On success the account is created for the token owner and the browser is redirected to

        `successReturnLink`; on failure to `failedReturnLink` with a `response` query parameter (Base64-encoded JSON errors).

        An account with the same label must not exist yet; without `label` a random one is generated.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TradePlatformStartAddingRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/TradePlatformStartAddingRequest'
      responses:
        '302':
          description: Redirect to the platform authorization page, or to `failedReturnLink?response=...` on validation error.
          headers:
            Location:
              schema:
                type: string
      security:
      - {}
      - tokenAuth: []
