                file: UEsDBBQAAAAI...
                filename: customs-template-USA-standard-DDP.xlsx
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: '`id` missing or unknown (empty body), or the template''s customs config no longer exists (JSON `message`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderProxyErrorV2'
              example:
                message: The customs configuration this template was built for no longer exists.
  /v1/order/customsDeclarationTemplate/{id}:
    get:
      operationId: customsGetDeclarationTemplateR02
      tags:
      - Customs
      summary: Get a customs declaration template
      description: One saved template by id, same shape as a list item (`canEdit` included). A template of another account
