            Set-Cookie:
              schema:
                type: string
              description: paymentReturnLink cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentFormData'
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - {}
      - tokenAuth: []
  /v1/onlinePayment/generateForm/order:
    post:
      operationId: paymentGenerateOrderForm
      tags:
      - Online Payments
      summary: Generate online payment form for an order
      description: 'Returns the payment provider form data for an order. When the current payment is a bank transfer it is
        converted to

        an online payment first. Without `onlinePaymentMethodId` the provider''s hosted payment page is used

        (method `GET`, single field `actionLink`) where the user picks the method.

        Rejected when the order does not exist, is paid or cancelled, the current payment is not a waiting bank-transfer/online

        payment, or the chosen method is unavailable / outside its limits.

        Sets a `paymentReturnLink` cookie (15 min) used by `/v1/onlinePayment/redirect`; send Ajax calls `withCredentials`.

        '
      parameters:
