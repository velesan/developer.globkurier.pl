      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderGroupOrdersRequest'
      responses:
        '204':
          description: Removed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
