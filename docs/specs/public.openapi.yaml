    OrderLabelName:
      type: object
      description: The name of one side of the order as the carrier of the product gets it.
      required:
      - labelName
      - labelNameShortened
      properties:
        labelName:
          type: string
          description: The full name, the `shortName`, the name abbreviated with the dictionary of legal forms, or the name
            cut at a word boundary, whichever fits first within the limit of the carrier integration.
          example: ROBOTSHOPS SERVICE SP. Z O.O.
        labelNameShortened:
          type: boolean
          description: Whether `labelName` differs from the full name.
          example: true
    OrderAddressInput:
      type: object
      description: Sender/receiver address of an order. Lengths are technical limits; carrier-specific limits of the street,
        house number and apartment number are validated additionally. A name longer than the limit of the carrier is not an
        error, the carrier gets a shortened name (see `shortName`) while invoices and customs documents keep the full one.
      required:
      - name
      - city
      - countryId
      properties:
        name:
          type: string
          maxLength: 64
          description: Name / full name. Must not contain % & + / ,
          example: Jan Kowalski
        shortName:
          type: string
          maxLength: 64
          description: Optional shorter name for the carrier, used when `name` is longer than the limit of the selected
            carrier integration (see `nameMaxLength` of the product). If it does not fit either, it is abbreviated (when the
            abbreviated short name would still not fit, the dictionary form of `name` is used if that fits) and, as the
            last resort, cut at a word boundary. The 64 characters are the width of the stored field, not a carrier
            limit. A blank value counts as none. For `senderAddress`, a missing short name is replaced by the company short
            name kept on the account (for a sub-account, on the main account) when `name` is the company name of that
            account; letter case and spacing do not matter. Must not contain % & + / ,
          example: ROBOTSHOPS
        city:
          type: string
          maxLength: 35
          description: City. Must not contain , @ ( ) /
          example: Warszawa
        street:
          type: string
          description: Street. Must not contain ( ) , @. If houseNumber is omitted the API tries to split the street into
            street and house number.
          example: Testowa
        houseNumber:
          type: string
          example: '1'
        apartmentNumber:
          type: string
          example: '2'
        postCode:
          type: string
          description: Required when the country uses post codes (`has_post_codes` in `/v1/countries`).
          example: 00-001
        countryId:
          type: integer
          description: Country ID from `/v1/countries`.
          example: 1
        stateId:
          type: integer
          nullable: true
          description: State ID from `/v1/states`; required for some products/countries (see `/v1/order/customRequiredFields`).
        pointId:
          type: string
          maxLength: 16
          nullable: true
          description: Drop-off / delivery point ID from `/v1/points`.
        phone:
          type: string
          description: Phone number valid for the address country.
          example: '+48000000000'
        email:
          type: string
          format: email
          example: jan.kowalski@example.com
        contactPerson:
          type: string
          maxLength: 30
        contactPhone:
          type: string
          description: Contact person phone (sender address only).
        nip:
          type: string
          description: Tax identification number valid for the country.
        fullAddress:
          type: string
          description: Whole address in one line; geocoded into the address fields and must match exactly one street address.
            When `countryId` is given, the search is restricted to that country and `countryId` is kept; otherwise
            the country is taken from the geocoding result.
    OrderUserAddressInput:
      type: object
      description: Ordering customer data; required only for anonymous orders.
      required:
      - type
      - name
      - surname
      - city
      - street
      - houseNumber
      - countryId
      - phone
      - email
      properties:
        type:
          type: string
          enum:
          - PERSON
          - COMPANY
        companyName:
          type: string
          description: Required for COMPANY.
        nip:
          type: string
          description: Required for COMPANY; must not be already used by another account.
        name:
          type: string
          maxLength: 30
        surname:
          type: string
          maxLength: 30
        city:
          type: string
          maxLength: 35
        street:
          type: string
          maxLength: 35
        houseNumber:
          type: string
          maxLength: 20
        apartmentNumber:
          type: string
          maxLength: 4
        postCode:
          type: string
        countryId:
          type: integer
        phone:
          type: string
        email:
          type: string
          format: email
          example: jan.kowalski@example.com
    OrderShipmentInput:
      type: object
      required:
      - length
      - width
      - height
      - weight
      - quantity
      properties:
        productId:
          type: integer
          description: Product ID from `/v1/products`.
        length:
          type: number
          description: Length in cm.
        width:
          type: number
          description: Width in cm.
        height:
          type: number
          description: Height in cm.
        weight:
          type: number
          description: Weight in kg (max. 2 decimal places).
        quantity:
          type: integer
          minimum: 1
          description: Number of parcels.
    OrderPickupInput:
      type: object
      description: Courier arrival for `collectionType=PICKUP`. When empty, the nearest possible arrival is chosen.
      properties:
        date:
          type: string
          format: date
          example: '2030-01-15'
        timeFrom:
          type: string
          description: From `/v1/order/pickupTimeRanges` (HH:MM).
          example: 08:00
        timeTo:
          type: string
          description: From `/v1/order/pickupTimeRanges` (HH:MM); must not be earlier than timeFrom.
          example: '16:00'
    OrderAddonInput:
      type: object
      required:
      - id
      description: Selected addon. Extra fields depend on the addon category.
      properties:
        id:
          type: integer
          description: Addon ID from `/v1/product/addons`.
        value:
          type: number
          description: INSURANCE / CASH_ON_DELIVERY / DECLARED_VALUE amount.
        bankAccountNumber:
          type: string
          description: CASH_ON_DELIVERY.
        swiftCode:
          type: string
          description: CASH_ON_DELIVERY.
        name:
          type: string
          description: CASH_ON_DELIVERY account holder / RETURN_SHIPMENT_ADDRESS name.
        addressLine1:
          type: string
          description: CASH_ON_DELIVERY.
        addressLine2:
          type: string
          description: CASH_ON_DELIVERY.
        quantity:
          type: integer
          description: RETURN_OF_DOCUMENTS.
        type:
          type: string
          description: RETURN_OF_DOCUMENTS document type.
        description:
          type: string
          description: RETURN_OF_DOCUMENTS.
        city:
          type: string
          description: RETURN_SHIPMENT_ADDRESS.
        street:
          type: string
          description: RETURN_SHIPMENT_ADDRESS.
        houseNumber:
          type: string
          description: RETURN_SHIPMENT_ADDRESS.
        apartmentNumber:
          type: string
          description: RETURN_SHIPMENT_ADDRESS.
        postCode:
          type: string
          description: RETURN_SHIPMENT_ADDRESS.
        phone:
          type: string
          description: RETURN_SHIPMENT_ADDRESS.
        countryId:
          type: integer
          description: RETURN_SHIPMENT_ADDRESS.
        email:
          type: string
          description: RETURN_SHIPMENT_ADDRESS.
        fields:
          type: object
          additionalProperties: true
          description: 'Extra fields of the addon category (see `addonCategoryFields` of `/v1/order/customRequiredFields`).
            The ADR addon (category `ADR`) carries its dangerous goods in `items` - see `POST /v1/order`.'
          properties:
            items:
              type: array
              minItems: 1
              maxItems: 20
              description: ADR addon only - the dangerous goods of the shipment.
              items:
                $ref: '#/components/schemas/AdrItem'
    OrderPackageInput:
      type: object
      required:
      - productId
      - length
      - width
      - height
      - weight
      - content
      description: One parcel of a multi-parcel order; every parcel must use a product of the same carrier service.
      properties:
        productId:
          type: integer
        length:
          type: number
        width:
          type: number
        height:
          type: number
        weight:
          type: number
        content:
          type: string
          minLength: 2
          maxLength: 100
        declaredValue:
          type: number
        insurance:
          type: number
        insuranceCargo:
          type: number
        cashOnDelivery:
          type: number
    OrderCustomsDeclarationInput:
      type: object
      additionalProperties: true
      description: 'Customs declaration. The set of fields and their rules come from the customs config of the carrier and
        route (dynamic);

        the common ones are listed. `totalWeight` may be a number (used as gross and net KG), `unitWeight` of a commodity
        is used for both gross and net weight.

        '
      properties:
        currency:
          type: string
          example: EUR
        total:
          type: number
          description: Total goods value (used as declared value).
        totalWeight:
          oneOf:
          - type: number
          - type: array
            items:
              type: object
              properties:
                unit:
                  type: string
                  example: KG
                weightGross:
                  type: number
                weightNet:
                  type: number
        purpose:
          type: string
        invoiceNumber:
          type: string
        invoiceDate:
          type: string
          format: date
        postalCharges:
          type: number
        sender:
          type: object
          properties:
            eori:
              type: string
        receiver:
          type: object
          properties:
            eori:
              type: string
        commodities:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              description:
                type: string
              hsCode:
                type: string
                description: Filled in automatically when missing.
              countryOfOrigin:
                type: string
              quantity:
                type: number
              unitValue:
                type: number
              subTotalValue:
                type: number
              unitWeight:
                type: number
              unitWeightGross:
                type: number
              unitWeightNet:
                type: number
              unitOfMeasurement:
                type: string
                default: KG
              composition:
                type: string
                default: '-'
              purpose:
                type: string
                default: '-'
    OrderCreateRequest:
      type: object
      required:
      - shipment
      - senderAddress
      - receiverAddress
      - content
      - paymentId
      - collectionType
      properties:
        shipment:
          allOf:
          - $ref: '#/components/schemas/OrderShipmentInput'
          - required:
            - productId
        senderAddress:
          allOf:
          - $ref: '#/components/schemas/OrderAddressInput'
          - required:
            - street
            - houseNumber
            - phone
            - email
        receiverAddress:
          $ref: '#/components/schemas/OrderAddressInput'
        userAddress:
          $ref: '#/components/schemas/OrderUserAddressInput'
        pickup:
          $ref: '#/components/schemas/OrderPickupInput'
        collectionType:
          type: string
          enum:
          - PICKUP
          - POINT
          - CROSSBORDER
          description: How the parcel is handed over; must be offered by the product.
        deliveryType:
          type: string
          enum:
          - PICKUP
          - POINT
          - CROSSBORDER
        content:
          type: string
          minLength: 2
          maxLength: 255
          description: Shipment content (see `/v1/order/content`).
        paymentId:
          type: integer
          description: 'Payment method: 1 BANK_TRANSFER, 2 ONLINE, 3 PREPAID, 4 BANK_TRANSFER_DEFERRED, 5 CASH, 6 NKO (paid
            by receiver), 7 TAX_CARE, 9 COLLECTIVE_PREPAID; must be available for the user and order value.'
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          - 9
        addons:
          type: array
          items:
            $ref: '#/components/schemas/OrderAddonInput'
        agreements:
          type: object
          description: Consent code -> boolean, codes from the agreements endpoint.
          additionalProperties:
            type: boolean
        originId:
          type: string
          description: Name of an active order source (ask for a personalised source code).
        instructions:
          type: string
          minLength: 2
          maxLength: 50
          description: Instructions for the carrier (verified manually - slows processing).
        declaredValue:
          type: number
          description: Declared value; required for some products/routes (see `/v1/order/customRequiredFields`).
        purpose:
          type: string
          enum:
          - SOLD
          - GIFT
          - SAMPLE
          - NOT_SOLD
          - PERSONAL_EFFECTS
          - REPAIR_AND_RETURN
          - RETURNED_GOODS
          description: Shipment purpose; required for some products/routes.
        discountCode:
          type: string
          description: Discount code; registered users only.
        referenceNumber:
          type: string
          minLength: 1
          maxLength: 15
        partnerProgramNumber:
          type: string
        salesMargin:
          type: number
          minimum: 0
          description: Sales margin; only for accounts with sales margin enabled.
        dutyPayerNumber:
          type: string
          maxLength: 64
          description: Alphanumeric duty payer account; defaulted from the account for DDP addons.
        dutyCountryId:
          type: integer
        dutyPostCode:
          type: string
        isImporter:
          type: boolean
        containsDangerousGoods:
          type: boolean
          description: 'Sender''s statement whether the shipment contains dangerous goods (DGR/ADR). Optional; when omitted
            the order is stored without a statement. Dangerous goods travel only with the ADR addon (category `ADR`), so the
            statement must agree with it: `true` without the ADR addon is rejected with `400` (`Dangerous goods are not
            accepted, this value must be false.`), `false` together with the ADR addon is rejected with `400` (`The order has
            the ADR addon, so it contains dangerous goods: this value must be true.`).'
        orderHash:
          type: string
          minLength: 64
          maxLength: 128
          description: Client-generated hash of the order; used for duplicate detection and to reuse a customs calculation.
        orderDraftId:
          type: integer
          description: Order draft to link the order to (authorized users).
        orderGroupId:
          type: integer
          description: Order group this order is the collective shipment of.
        packages:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderPackageInput'
        customs:
          $ref: '#/components/schemas/OrderCustomsDeclarationInput'
        customsTemplateName:
          type: string
          maxLength: 200
          description: Saves the declaration as a named template (must be unique).
    OrderBestPriceAddressInput:
      allOf:
      - $ref: '#/components/schemas/OrderAddressInput'
      - type: object
        properties:
          country:
            type: string
            description: ISO code or zone code; replaces countryId.
            example: PL
          state:
            type: string
            description: State code; replaces stateId.
    OrderBestPriceRequest:
      type: object
      required:
      - shipment
      - senderAddress
      - receiverAddress
      - content
      - paymentId
      - collectionType
      properties:
        shipment:
          allOf:
          - $ref: '#/components/schemas/OrderShipmentInput'
          - type: object
            properties:
              integrationName:
                type: string
                description: Carrier integration name; replaces productId. Optional - without it the best offer of any carrier
                  is used.
                example: DHL
              serviceCode:
                type: string
                description: Carrier-specific service code.
        senderAddress:
          $ref: '#/components/schemas/OrderBestPriceAddressInput'
        receiverAddress:
          $ref: '#/components/schemas/OrderBestPriceAddressInput'
        userAddress:
          $ref: '#/components/schemas/OrderUserAddressInput'
        pickup:
          $ref: '#/components/schemas/OrderPickupInput'
        collectionType:
          type: string
          enum:
          - PICKUP
          - POINT
          - CROSSBORDER
        deliveryType:
          type: string
          enum:
          - PICKUP
          - POINT
          - CROSSBORDER
          description: Set to POINT automatically when the receiver has pointId.
        receiverType:
          type: string
          enum:
          - PERSON
          - COMPANY
          default: PERSON
          description: Receiver type, required by some carriers.
        content:
          type: string
          minLength: 2
          maxLength: 255
        paymentId:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          - 9
        addons:
          type: object
          description: 'Addons keyed by category, e.g. `{"INSURANCE": {"value": 500}, "CASH_ON_DELIVERY": {"value": 100}}`,
            or by numeric index with an explicit `id`, e.g. `{"0": {"id": 123}}`. For logged-in users a COD with only
            `value` gets the bank data from the profile.

            `valueCurrency` (optional, applies to INSURANCE, DECLARED_VALUE and CASH_ON_DELIVERY) is the currency the
            `value` is denominated in. Keyed by category: a hard filter with no conversion — only an addon whose
            configured value range uses that currency is considered, and the cheapest matching one is picked; no
            match behaves like a value outside the addon''s min/max (the addon is not available). Keyed by numeric
            index together with an explicit `id`: an optional client-side assertion — the id is never re-picked, but
            a currency mismatch between what you expect and what the addon is actually configured with is rejected
            with a 400 on that exact index (`addons[N][valueCurrency]`).'
          additionalProperties:
            type: object
            additionalProperties: true
        agreements:
          type: object
          additionalProperties:
            type: boolean
        originId:
          type: string
        instructions:
          type: string
          maxLength: 50
        declaredValue:
          type: number
        purpose:
          type: string
          enum:
          - SOLD
          - GIFT
          - SAMPLE
          - NOT_SOLD
          - PERSONAL_EFFECTS
          - REPAIR_AND_RETURN
          - RETURNED_GOODS
        discountCode:
          type: string
        referenceNumber:
          type: string
          maxLength: 15
        partnerProgramNumber:
          type: string
        salesMargin:
          type: number
        dutyPayerNumber:
          type: string
        orderHash:
          type: string
        packages:
          type: array
          items:
            $ref: '#/components/schemas/OrderPackageInput'
        customs:
          $ref: '#/components/schemas/OrderCustomsDeclarationInput'
    OrderPlacementPrice:
