          description: Amount still to pay.
        priceNet:
          type: number
        vatPLN:
          type: number
          nullable: true
          description: VAT amount in PLN.
        currency:
          type: string
          example: PLN
        currencyRate:
          type: number
          description: Exchange rate on the issue date.
        issueDateTime:
          type: string
          description: Issue date and time (`YYYY-MM-DD HH:MM:SS`).
          example: '2024-01-31 07:00:00'
        orderDate:
          type: string
          format: date
        paymentDueDate:
          type: string
          format: date
        settlementDate:
          type: string
