          maxItems: 10
          items:
            $ref: '#/components/schemas/OrderStatisticMetric'
      responses:
        '200':
          description: Metrics keyed by metric name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  metrics:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/OrderStatisticValue'
              example:
                metrics:
                  crossBorderCreated:
                    type: count
                    value: 12
                    label: Created
                  crossBorderDelivered:
                    type: countWithVolume
                    value: 8
                    volume: 10
                    label: Delivered (30 days)
                  customsDutyAndVatPaidYtd:
                    type: money
                    values:
                    - amount: '123.45'
                      currency: PLN
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/orders/stats:
    get:
      operationId: orderGetMonthlyStats
      tags:
      - Orders
      summary: Get monthly order statistics
      description: 'Monthly breakdown of the account''s orders between `filters[dateFrom]` and `filters[dateTo]`. Dates are
        compared at

        month granularity (`YYYY-MM`), so any day inside a month includes the whole month. For each month: COD totals, orders

        per carrier and counts of delivered / in-transit / cancelled orders; `totalStatuses` sums the status counts over the

        whole range (an empty array when there are no orders).

        Both dates are effectively required: the validator accepts their absence, but the query needs them.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: filters[dateFrom]
        in: query
        description: Start date (month granularity).
        schema:
          type: string
          format: date
        example: '2025-01-01'
      - name: filters[dateTo]
        in: query
        description: End date (month granularity).
        schema:
          type: string
          format: date
        example: '2025-12-31'
      responses:
        '200':
          description: Monthly statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderMonthlyStats'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/payments/bankAccountNumbers:
    get:
