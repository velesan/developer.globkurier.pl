        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 25
      responses:
        '200':
          description: Page of named declarations.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCustomsNamedDeclarationPageV2'
        '400':
          description: '`offset` negative or `limit` outside 1-200.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderProxyErrorV2'
        '401':
          $ref: '#/components/responses/Unauthorized'
