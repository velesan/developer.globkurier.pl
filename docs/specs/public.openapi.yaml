        street:
          type: string
          minLength: 1
          maxLength: 35
        houseNumber:
          type: string
          minLength: 1
          maxLength: 20
        apartmentNumber:
          type: string
          minLength: 1
          maxLength: 20
        postCode:
          type: string
          description: Required when the country uses post codes.
        city:
          type: string
          minLength: 3
          maxLength: 35
        countryId:
          type: integer
          description: Defaults to the current country; cannot be changed once the account type is set.
        phone:
