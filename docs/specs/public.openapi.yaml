      description: Registers a new Allegro integration in hermes-2 for the logged-in customer. Credentials come from the OAuth
        flow (`POST /v1/oauth/allegro` -> Allegro -> `GET .../allegro/account/verify` -> `GET .../allegro/account/credentials`)
        and may be sent either nested in `credentials` or flat at the top level. GlobKurier adds the customer id, e-mail,
        environment and a generated `externalShopId` (`ALLEGRO_...`). Anonymous callers get `401`. A hermes-2 rejection is
        returned as `400` with the hermes-2 error body.
      parameters:
