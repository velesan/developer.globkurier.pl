            `COMPANY`, ignored for a private account and for a sub-account. Surrounding spaces are cut before the length
            is checked (3 to 30 characters). Not sent = left as it was; sent as an empty string, spaces only or `null` =
            cleared, which skips the minimum.
        nip:
          type: string
