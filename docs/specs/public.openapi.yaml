    ProductQuoteAddress:
      type: object
      description: The address part a quote depends on. Other `POST /v1/order` address fields are accepted and ignored.
      additionalProperties: true
      required:
      - countryId
      properties:
        countryId:
          type: integer
        postCode:
          type: string
          maxLength: 10
          description: Required format when the country uses post codes. Optional, but carrier availability, remote-area
            surcharges and zone prices depend on it — without it they are not taken into account.
        city:
          type: string
          maxLength: 50
    ProductQuoteRequest:
      type: object
      description: The shipment part of a `POST /v1/order` body. Unknown top-level fields are rejected.
      required:
      - senderAddress
      - receiverAddress
      - shipment
      - collectionType
      properties:
        senderAddress:
          $ref: '#/components/schemas/ProductQuoteAddress'
        receiverAddress:
          $ref: '#/components/schemas/ProductQuoteAddress'
        shipment:
          type: object
          additionalProperties: true
          description: Other `POST /v1/order` shipment fields are accepted and ignored, `productId` included.
          required:
          - length
          - width
          - height
          - weight
          - quantity
          properties:
            length:
              type: integer
              minimum: 1
              description: Length [cm].
            width:
              type: integer
              minimum: 1
              description: Width [cm].
            height:
              type: integer
              minimum: 1
              description: Height [cm].
            weight:
              type: number
              description: Weight of one package [kg], max 2 decimal places.
            quantity:
              type: integer
              minimum: 1
              description: Number of packages/pallets.
            integrationName:
              type: string
              description: |
                Only this carrier's offers, as in `POST /v1/order/bestPrice` — one carrier name, case-insensitive;
                an unknown one is a `400` (`Wrong integration name`). With a parcel point chosen (`GET /v1/points`),
                send its carrier here with `deliveryType: POINT` (receiver's point) or `collectionType: POINT`
                (sender's point): the quote then offers only that carrier's point products. `pointId` itself does not
                narrow the offers — the same point code exists at several carriers.
        collectionType:
          type: string
          enum:
          - PICKUP
          - POINT
          - CROSSBORDER
          description: How the shipment is handed over; decides the paid collection addon of the offer.
        deliveryType:
          type: string
          enum:
          - PICKUP
          - POINT
          - CROSSBORDER
          description: Restricts the offers to products delivering this way.
        paymentId:
          type: integer
          default: 1
          description: Payment method of the order (as in `POST /v1/order`); it changes which addons are available
            and the VAT. NKO (6) and COUPON (8) cannot be quoted.
        receiverType:
          type: string
          enum:
          - PERSON
          - COMPANY
          default: PERSON
          description: Picks the receiver type addon for carriers that need one; a carrier serving only the other type
            is left out.
        content:
          type: string
          description: Shipment content. Contents exempt from customs clearance (e.g. documents) do not take customs
            premium addons.
        purpose:
          type: string
          description: Customs purpose of the shipment, as in `POST /v1/order`.
        orderHash:
          type: string
          description: Hash of the customs calculation made for this shipment. Needed to price `DUTY_DDP_PREMIUM` /
            `DUTY_DAP_PREMIUM`, whose price is the calculated duty and tax.
        declaredValue:
          type: number
          description: Declared value in the order currency. Insurance with a maximum may not exceed it.
        pickup:
          type: object
          description: The courier pickup as in `POST /v1/order` (`date`, `timeFrom`, `timeTo`); only checked for
            presence, against `missingFields`.
        customs:
          type: object
          description: The customs declaration as in `POST /v1/order`. It drives the declared value and the duty
            premium of the offers, and each offer checks it against its own form (`invalidFields`).
        dutyPayerNumber:
          type: string
          description: The payer's carrier account number a `DUTY_*_OUTER` addon is charged to.
        addons:
          type: object
          description: |
            Wanted addon categories, keyed by the category code from `GET /v1/addons/categories` — a map of
            categories, unlike the list of addon ids `POST /v1/order` takes (the quote answers with that list).
            `value` is required for `CASH_ON_DELIVERY`, `INSURANCE`, `INSURANCE_CARGO` and `DECLARED_VALUE`
            (min 1, decimal places of its currency) and ignored for the rest. `currency` is the currency of `value`;
            defaults to the order currency. A category unknown to the API, or one the order adds by itself, is a `400`.
          additionalProperties:
            type: object
            description: The addon's other `POST /v1/order` fields may ride along (e.g. `bankAccountNumber` of a cash
              on delivery) and are checked only for presence, against `missingFields`.
            additionalProperties: true
            properties:
              value:
                type: number
                minimum: 1
              currency:
                $ref: '#/components/schemas/OrderCurrency'
              fields:
                type: object
                description: The addon category's own fields, as under the addon's `fields` in `POST /v1/order`.
        discountCode:
          type: string
          minLength: 1
          description: A discount code, as in `POST /v1/order`, for signed-in clients. For them one that does not exist
            or is no longer active is a `400` (`This discount code is invalid or expired.`); otherwise every offer says
            in `discountCode` whether its price carries it. A guest — also one quoted as the account it would register
            — gets every offer without the code and the reason `POST /v1/order` gives a guest.
        account:
          type: object
          description: |
            Guests only — the account the guest would register (`POST /v1/user`), to be quoted the prices that
            account gets instead of the guest ones: the price list it starts on (the registration link's, then the
            referring partner's, then the default one for its type), net prices for a company from outside Poland
            and no fee for ordering without an account. Nothing is stored. A signed-in client is quoted on its own
            account, so sending it with a token is a `400`.
          additionalProperties: false
          required:
          - type
          - countryId
          properties:
            type:
              type: string
              enum:
              - PERSON
              - COMPANY
            countryId:
              type: integer
              minimum: 1
              description: The country of the account (`GET /v1/countries`).
            taxId:
              type: string
              maxLength: 30
              description: The tax id the account would be registered with.
            registrationLink:
              type: string
              maxLength: 100
              description: The registration link tail the guest came with, as `registrationLink` of `POST /v1/user`.
            partnerProgramNumber:
              oneOf:
              - type: string
                maxLength: 10
              - type: integer
              description: The referring partner's number, as `partnerProgramNumber` of `POST /v1/user`.
    ProductQuoteResult:
      type: object
      properties:
        offers:
          type: array
          description: The cheapest first.
          items:
            $ref: '#/components/schemas/ProductQuote'
        hints:
          type: array
          description: |
            One entry per carrier that has no offer but would have one after a change to the request; a carrier
            already in `offers` gets none. Each entry names the carrier's product needing the fewest changes and up to
            3 options. An option is the full set of changes to make, checked against the same addon rules as the offers.
            The declared value is never suggested for a change. A carrier with no such change, or past the request's
            search budget, gets no hint. Hints carry no price: send the changed request to get the offer and its price.
          items:
            $ref: '#/components/schemas/ProductQuoteHint'
        customsDeclarationConfigs:
          type: object
          description: The customs declaration forms the offers need, each once, by the offers'
            `customsDeclaration.configKey` — the configuration `GET /v2/customs/config` gives (fields, constraints,
            labels in `Accept-Language`). Empty when no offer needs a declaration.
          additionalProperties:
            type: object
    ProductQuoteHint:
      type: object
      properties:
        carrierName:
          type: string
        product:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
              nullable: true
        options:
          type: array
          description: The smallest sets of changes found, gentlest first (another currency, a lower value, unchecking).
          items:
            type: array
            items:
              $ref: '#/components/schemas/ProductQuoteChange'
    ProductQuoteChange:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - UNCHECK
          - LOWER_VALUE
          - CHANGE_CURRENCY
          - CHANGE_RECEIVER_TYPE
          description: |
            * `UNCHECK` — drop `category` from `addons`.
            * `LOWER_VALUE` — set the `value` of `category` to at most `maxValue` (in `currency`).
            * `CHANGE_CURRENCY` — send the same `value` of `category`, as an amount in `currency`.
            * `CHANGE_RECEIVER_TYPE` — set `receiverType` to `receiverType`.
        category:
          type: string
        maxValue:
          type: number
        currency:
          $ref: '#/components/schemas/OrderCurrency'
        receiverType:
          type: string
          enum:
          - PERSON
          - COMPANY
    ProductQuote:
      type: object
      properties:
        product:
          description: The product as `GET /v1/products` returns it; its own prices are the transport alone.
          allOf:
          - $ref: '#/components/schemas/ProductSearchItem'
        addons:
          type: array
          description: Send as `addons` of `POST /v1/order`; add the category fields the order asks for (e.g. the bank
            account of a cash on delivery).
          items:
            type: object
            required:
            - id
            properties:
              id:
                type: integer
              value:
                type: number
                description: Present for value-bearing addons, in the addon's currency.
        addonDetails:
          type: array
          description: Why each of `addons` is in the offer, for a form that must not let the client uncheck what the
            order needs.
          items:
            type: object
            required:
            - id
            - category
            - origin
            properties:
              id:
                type: integer
              category:
                type: string
                description: Addon category code (`GET /v1/addons/categories`).
              origin:
                type: string
                enum:
                - REQUESTED
                - REQUIRED
                - ORDER_RULE
                description: |
                  `REQUESTED` — asked for by the client, who may uncheck it. `REQUIRED` — the order of this shipment is
                  refused without it (the product, the account or the package size demands it); it cannot be unchecked.
                  `ORDER_RULE` — added by an order rule (insurance covering a cash on delivery, paid collection, the pick
                  of a required group); it goes when its reason goes.
        pricing:
          description: The price of the whole order with these addons — the same as `GET /v1/order/price` returns.
          allOf:
          - $ref: '#/components/schemas/OrderPricing'
        discountCode:
          type: object
          description: Present when the request carries `discountCode`. The code is checked on each offer the way
            `POST /v1/order` checks it; an offer it does not apply to keeps its price without the code and says why.
          required:
          - applied
          properties:
            applied:
              type: boolean
              description: Whether `pricing` carries the code.
            message:
              type: string
              description: Why the order would refuse the code on this offer (e.g. a minimum order value, a code
                for registered clients only).
        requiredFields:
          description: The order fields this product needs on this route and collection type — the same object
            `GET /v1/order/customRequiredFields` returns, with `addonCategoryFields` narrowed to the offer's addons.
            Build the order form from it.
          allOf:
          - $ref: '#/components/schemas/OrderCustomRequiredFields'
        customsDeclaration:
          type: object
          nullable: true
          description: The carrier needs a customs declaration (`customs` in `POST /v1/order`) on this route; null
            when it does not.
          required:
          - configKey
          properties:
            configKey:
              type: string
              description: The key of the declaration form in `customsDeclarationConfigs` — the carrier, followed by
                `|<incoterm>` for an incoterm with a form of its own (`TEST CARRIER|DUTY_DDP_MARKETPLACE`).
            dutyPremiumRefusal:
              type: string
              description: Why `POST /v1/order` would refuse this offer over the duty premium it adds by itself — the
                customs prepaid balance does not cover the duties, and by how much.
        missingFields:
          type: array
          description: |
            Fields the order form requires for this offer that the request does not carry yet, as paths of this
            request body — send them here to see them cleared: `receiverAddress[phone]`, `pickup[date]`, `purpose`,
            `dutyPayerNumber` (a `DUTY_*_OUTER` addon), `customs` (signed-in clients, when the carrier has a
            customs declaration form on the route), `addons[CASH_ON_DELIVERY][bankAccountNumber]` (in `POST /v1/order`
            on the addon entry) and `addons[<CATEGORY>][fields][<name>]` (in `POST /v1/order` under the addon's
            `fields`). They never hide an offer — they tell the client what to fill in before ordering it.
          items:
            type: string
        invalidFields:
          type: array
          description: Fields the request already carries that this carrier would reject (e.g. a street too long for
            it, `customs[commodities][0][hsCode]` its customs declaration form rejects), as paths of this request body.
            Like missing fields, they do not hide the offer.
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
        fieldLimits:
          type: object
          description: Address field lengths the carrier accepts, per side.
          properties:
            senderAddress:
              $ref: '#/components/schemas/CarrierAddressFieldLimits'
            receiverAddress:
              $ref: '#/components/schemas/CarrierAddressFieldLimits'
    CarrierAddressFieldLimits:
      type: object
      properties:
        name:
          type: integer
        street:
          type: integer
        houseNumber:
          type: integer
        apartmentNumber:
          type: integer
        addressLine:
          type: object
          description: Present when the carrier limits several fields together.
          properties:
            fields:
              type: string
              enum:
              - streetHouseApartment
              - houseApartment
              description: '`streetHouseApartment` — "street house/apartment" as one line; `houseApartment` — house
                and apartment number together.'
            maxLength:
              type: integer
    ProductPricingOffer:
      type: object
