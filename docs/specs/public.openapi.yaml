  /v1/orders:
    delete:
      operationId: orderCancelMany
      tags:
      - Orders
      summary: Cancel multiple orders
      description: 'Cancels a batch of orders identified by their hashes (up to 10 000 per call). Each order goes through
        the same

        cancellation flow as `DELETE /v1/order`: depending on its status and on whether the label was downloaded, the order
        is

        either cancelled immediately (payments, COD and customs payments are reversed) or moved to

        `AWAITING_CARRIER_CANCELLATION` while the carrier is asked to cancel it.

        Per-order results are grouped by message type (`success`, `partial`, `error`) and keyed by order hash; a failure of

        one order does not stop the others. Every hash must exist and must not already be `CANCELED`, otherwise the whole

        request is rejected with `400`.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCancelManyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OrderCancelManyRequest'
      responses:
        '200':
          description: Cancellation results per order hash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCancelManyResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - {}
      - tokenAuth: []
    get:
      operationId: orderGetList
      tags:
      - Orders
      summary: Get order list
      description: 'Paginated list of the account''s orders, newest first. All filters are optional and intersect.

        The list always covers the main account; a sub-account without the company-orders agreement sees only its own

        orders (this narrowing cannot be overridden with `filters[subUserId]`).

        `filters[numbers][]` matches either GK order numbers or carrier tracking numbers (exact match); a number that matches

        nothing yields an empty list, not `400`. `filters[trackingNumber]` and `filters[groupId]` must exist, otherwise `400`.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: limit
        in: query
        description: Page size, default 25, maximum 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: offset
        in: query
        description: Zero-based position of the first result, default 0.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: filters[status]
        in: query
        description: Shipment status. Accepts a single value or a list (`filters[status][]=A&filters[status][]=B`).
        style: form
        explode: true
        schema:
          oneOf:
          - $ref: '#/components/schemas/OrderShipmentStatus'
          - type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/OrderShipmentStatus'
      - name: filters[statusCrossborder]
        in: query
        description: Cross-border dashboard tile filter (single value or list); same keys as `GET /v1/orders/statistics` metrics.
        schema:
          oneOf:
          - $ref: '#/components/schemas/OrderCrossBorderStatusFilter'
          - type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/OrderCrossBorderStatusFilter'
      - name: filters[statusCustoms]
        in: query
        description: Customs tile filter (single value or list).
        schema:
          oneOf:
          - type: string
            enum:
            - customsActionRequired
          - type: array
            minItems: 1
            items:
              type: string
              enum:
              - customsActionRequired
      - name: filters[isCOD]
        in: query
        description: 1 - only orders with a CASH_ON_DELIVERY addon, 0 - only without.
        schema:
          type: string
          enum:
          - '0'
          - '1'
      - name: filters[isCustoms]
        in: query
        description: 1 - only orders with customs clearance, 0 - only without.
        schema:
          type: string
          enum:
          - '0'
          - '1'
      - name: filters[hasGroup]
        in: query
        description: 1 - only orders assigned to an order group (masterpack), 0 - only unassigned.
        schema:
          type: string
          enum:
          - '0'
          - '1'
      - name: filters[transportType]
        in: query
        description: Transport type group. `NON_CROSSBORDER` excludes cross-border products.
        schema:
          type: string
          enum:
          - ROAD
          - AIR
          - CROSSBORDER
          - NON_CROSSBORDER
      - name: filters[carrierNames][]
        in: query
        description: Carrier names (1-25), each must exist.
        style: form
        explode: true
        schema:
          type: array
          minItems: 1
          maxItems: 25
          items:
            type: string
      - name: filters[dateFrom]
        in: query
        description: Order creation date from (inclusive).
        schema:
          type: string
          format: date
      - name: filters[dateTo]
        in: query
        description: Order creation date to (inclusive).
        schema:
          type: string
          format: date
      - name: filters[receiver]
        in: query
        description: Search in receiver data (name, city, street, phone). Must not be blank.
        schema:
          type: string
          minLength: 1
      - name: filters[sender]
        in: query
        description: Search in sender data (name, city, street, phone). Must not be blank.
        schema:
          type: string
          minLength: 1
      - name: filters[content]
        in: query
        description: Search in shipment content.
        schema:
          type: string
          minLength: 2
          maxLength: 255
      - name: filters[numbers][]
        in: query
        description: GK order numbers and/or carrier tracking numbers (1-25), exact match.
        style: form
        explode: true
        schema:
          type: array
          minItems: 1
          maxItems: 25
          items:
            type: string
        example:
        - GK000000000PL
      - name: filters[referenceNumber]
        in: query
        description: Client reference number.
        schema:
          type: string
          minLength: 1
          maxLength: 15
      - name: filters[groupId]
        in: query
        description: Id of a live order group (masterpack) of this account.
        schema:
          type: integer
      - name: filters[groupName]
        in: query
        description: Partial match on order group name.
        schema:
          type: string
          minLength: 1
          maxLength: 80
      - name: filters[trackingNumber]
        in: query
        description: Carrier tracking number; must exist.
        schema:
          type: string
      - name: filters[subUserId]
        in: query
        description: Narrow to orders of one sub-account of the main account.
        schema:
          type: integer
      responses:
        '200':
          description: Page of orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
