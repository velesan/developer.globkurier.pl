  /v1/points:
    get:
      operationId: pointGetList
      tags:
      - Points
      summary: Get pickup/delivery points
      description: 'Returns carrier points (parcel lockers, PUDO) for a product or a carrier. Either `productId` or `carrierName`
        is required;

        with `carrierName`, `serviceCode` may narrow the service. Points come live from the carrier integration (Globbox

        returns the user''s own profile as the only point); a product without point support returns an empty list.

        Rules: `id` (single point lookup) cannot be combined with `postCode`/`city`/`isCashOnDeliveryAddonSelected`; breaking

        this rule returns `400` with a general error `Invalid parameters`. A search by `postCode` or `city` without

        `isCashOnDeliveryAddonSelected` treats it as `false`. `filter` does a fuzzy match on point data; `type` keeps only APM or PUDO points; `side=SENDER`

        drops points that do not accept parcels from senders. `addressType` is passed to the carrier and echoed in each point.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: productId
        in: query
        description: Product id from `GET /v1/products`. Required unless `carrierName` is given; the product must support
          points.
        schema:
          type: integer
      - name: carrierName
        in: query
        description: Carrier name (alternative to `productId`).
        schema:
          type: string
        example: DHL
      - name: serviceCode
        in: query
        description: Carrier service code, only together with `carrierName`.
        schema:
          type: string
      - name: id
        in: query
        description: Point id - returns that single point. Cannot be combined with search parameters.
        schema:
          type: string
          maxLength: 20
          pattern: ^[\w\-]+$
      - name: isCashOnDeliveryAddonSelected
        in: query
        description: Whether a CASH_ON_DELIVERY addon is selected; defaults to `false`.
        schema:
          type: boolean
          default: false
      - name: postCode
        in: query
        description: Return points at or near this post code.
        schema:
          type: string
        example: 00-001
      - name: city
        in: query
        description: Return points in this city.
        schema:
          type: string
          minLength: 3
          maxLength: 30
      - name: filter
        in: query
        description: Space-separated words fuzzy-matched against point data; no punctuation.
        schema:
          type: string
          minLength: 3
          maxLength: 50
      - name: addressType
        in: query
        description: Point role requested from the carrier.
        schema:
          type: string
          enum:
          - sender
          - receiver
          - crossborder
      - name: side
        in: query
        description: With `SENDER`, points that do not accept dispatch are dropped.
        schema:
          type: string
          enum:
          - SENDER
          - RECEIVER
      - name: type
        in: query
        description: Keep only points of this type.
        schema:
          type: string
          enum:
          - APM
          - PUDO
      - name: countryId
        in: query
        description: Country id from `GET /v1/countries`, default Poland.
        schema:
          type: integer
      responses:
        '200':
          description: Points.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PointParcelPoint'
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - {}
      - tokenAuth: []
