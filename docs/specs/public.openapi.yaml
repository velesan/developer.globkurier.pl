        (hermes-2). `id` is the hermes-2 UUID from `GET /v1/integrations/tradePlatform/integrations`. The id must be on the
        caller's own integration list for this marketplace, otherwise `400 Account not found or access denied` (also when
        hermes-2 is unavailable - the check fails closed). The ACL admits anonymous callers, but the controller answers them
        with `401`. The object is passed through from hermes-2 unchanged; when hermes-2 returns nothing the body is an empty
