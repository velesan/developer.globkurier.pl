        isPayableByPrepaid:
          type: boolean
          description: Can be paid from the prepaid wallet (balance not considered).
    InvoiceEmail:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
          example: jan.kowalski@example.com
        title:
          type: string
          description: Translated notification name.
        date:
          type: string
          example: '2024-01-31T07:00:05'
        typeId:
          type: integer
        type:
          type: string
          enum:
          - OTHER
          - DOCUMENT_ISSUED
          - REMIND_OF_PAYMENT_1
          - REMIND_OF_PAYMENT_2
          - DEMAND_FOR_PAYMENT_1
          - DEMAND_FOR_PAYMENT_2
    MarketplaceAllegroCapabilities:
      type: object
      properties:
        canDispatch:
          type: boolean
        reason:
          type: string
          description: Why dispatch is (not) possible; `UNKNOWN` when the integration service did not answer.
          example: UNKNOWN
        accounts:
          type: array
          description: Allegro accounts of the caller as reported by the integration service.
          items:
            type: object
            additionalProperties: true
    OrderDraftAddress:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 64
        shortName:
          type: string
          nullable: true
          maxLength: 64
          description: Short form of the name for the carrier, optional. A name over the limit of the carrier is shortened by
            the backend when the order is placed, this value is then used first. Surrounding spaces are cut; blank means none
            and the key is left out of the response. The characters `% & + / ,` are refused with `400`.
        city:
          type: string
          maxLength: 50
        street:
          type: string
          maxLength: 150
        houseNumber:
          type: string
          maxLength: 50
        apartmentNumber:
          type: string
          maxLength: 50
        postCode:
          type: string
          maxLength: 10
        countryId:
          type: integer
        stateId:
          type: integer
        phone:
          type: string
          maxLength: 50
          description: Checked against the format of `countryId` when filled in.
        email:
          type: string
          maxLength: 50
        contactPerson:
          type: string
          maxLength: 50
        tin:
          type: string
          maxLength: 24
          description: Tax identification number.
        pointId:
          type: string
          maxLength: 30
          description: Drop-off/pick-up point id (POINT collection).
    OrderDraftInput:
      type: object
      additionalProperties: false
      description: Draft fields; all optional on edit. Unknown fields are rejected.
      properties:
        draftOrigin:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          - 8
          description: 1 Allegro, 2 eBay, 3 CSV, 4 copy, 5 Erli, 6 eMAG, 7 Etsy, 8 Sellasist.
        collectionType:
          type: string
          enum:
          - PICKUP
          - POINT
          description: PICKUP must not carry `senderAddress.pointId`; POINT must not carry `pickup`.
        content:
          type: string
          maxLength: 255
        description:
          type: string
          maxLength: 255
        paymentId:
          type: integer
        discountCode:
          type: string
          maxLength: 50
        referenceNumber:
          type: string
          maxLength: 15
        purpose:
          type: string
          enum:
          - SOLD
          - GIFT
          - SAMPLE
          - NOT_SOLD
          - PERSONAL_EFFECTS
          - REPAIR_AND_RETURN
          - RETURNED_GOODS
        declaredValue:
          type: number
          minimum: 1
          maximum: 100000000
        shipment:
          type: object
          additionalProperties: false
          properties:
            length:
              type: integer
              description: cm
            width:
              type: integer
              description: cm
            height:
              type: integer
              description: cm
            weight:
              type: number
              description: kg
            productId:
              type: integer
            quantity:
              type: integer
              minimum: 1
              maximum: 15
            integrationName:
              type: string
              description: Carrier integration name.
        senderAddress:
          $ref: '#/components/schemas/OrderDraftAddress'
        receiverAddress:
          $ref: '#/components/schemas/OrderDraftAddress'
        addons:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
        pickup:
          type: object
          additionalProperties: false
          properties:
            date:
              type: string
              format: date
            timeFrom:
              type: string
              example: 08:00
            timeTo:
              type: string
              example: '16:00'
    OrderDraftAccepted:
      type: object
      properties:
        href:
          type: string
          example: /user/order/drafts
        title:
          type: string
          example: Get user order drafts
        type:
          type: string
          example: GET
    OrderDraftCollectionError:
      type: object
      description: '`general` errors and/or, per element/row index, field path => message.'
      properties:
        general:
