        description: '`true`/`1` returns only the favorite contacts, `false`/`0` only the others (case-insensitive); omitted
          or empty returns all. Also accepted as `filters[favorite]` (used when `favorite` is absent or empty). Any other value
          returns `400` with `fields.favorite`.'
