      description: 'Free-text search in the account''s sender or receiver address book (substring match on name, e-mail, street,

        house/apartment number, post code, city, contact person and phone). Returns all matches without pagination and

        without contact ids. Prefer `GET /v1/user/addressBook/senders` / `receivers`. Unknown query parameters are rejected.

        '
