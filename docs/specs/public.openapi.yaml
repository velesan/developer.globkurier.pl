  /v1/products/quotes:
    post:
      operationId: productQuotes
      tags:
      - Products
      summary: Quote every product for a shipment, with the addons to order
      description: |
        The step before `POST /v1/order`: the client describes the shipment and the services it wants, and gets back
        every product able to carry it, each with the addon selection to order and the price of the whole order.

        **Flow**
        1. `GET /v1/addons/categories` — the addon categories that currently have active addons, i.e. the ones
           worth asking for. It follows the carriers we integrate, so read it instead of hardcoding a list.
        2. `POST /v1/products/quotes` — the shipment plus the wanted categories (`addons`).
        3. The client picks one offer and sends `POST /v1/order` with `shipment.productId` = `offers[].product.id`
           and `addons` = `offers[].addons`, together with the rest of the order (addresses, contents, pickup).

        **How an offer is chosen per product**
        * Every addon of a requested category that the order would accept is tried: a value-bearing category
          (`CASH_ON_DELIVERY`, `INSURANCE`, `INSURANCE_CARGO`, `DECLARED_VALUE`) takes an addon whose maximum
          covers `value` (an addon without a maximum covers any value) in the same currency.
        * The selection is completed the way `POST /v1/order` requires: required addons, the receiver type addon
          (from `receiverType`), a trade documents option when the carrier needs one, the paid collection addon of
          `collectionType`, and insurance covering a cash on delivery that requires it.
        * Every combination is checked with the order's own addon rules and priced in full — product, fuel
          surcharge, addons, VAT, the client's price group and currency — exactly as `GET /v1/order/price` prices
          it. The cheapest one becomes the offer. Up to 16 combinations per product are priced, ranked by the price
          of their addons, so a selection whose addons alone cost more than 16 others is not considered.
          Offers are sorted by `pricing.totalGrossPrice`.
        * A product that cannot serve the request (no such addon, the value out of range or in another currency,
          addons the order does not allow together, the receiver type not served) is left out of `offers`; when a
          change to the request would bring it in, it is listed in `hints` with that change — e.g. "uncheck
          SATURDAY_DELIVERY" or "lower INSURANCE to 5000 PLN" (one hint per carrier without an offer). Nothing is
          rejected for data the client has not entered yet.

        **Body** is the shipment part of a `POST /v1/order` body: the address and shipment objects may carry the
        remaining order fields (name, street, …), which are ignored here, so a client can send the order it is
        filling in. `shipment.productId` is ignored too — the product is what the quote returns.

        `fieldLimits` give the address field lengths the chosen carrier accepts, so the order form can ask the
        client to shorten a field before `POST /v1/order` rejects it.

        **Building the order form from an offer:** `missingFields` say what to ask for, the dictionaries give the
        choices (`GET /v1/countries`, `GET /v1/states`, `GET /v1/points`, `GET /v1/order/pickupTimeRanges`; the
        customs declaration form is in the answer — `customsDeclarationConfigs[<offer's customsDeclaration.configKey>]`),
        `POST /v1/order/validate` checks each field as
        it is filled in by the rules `POST /v1/order` applies, and the offer's `product.id` and `addons` go to
        `POST /v1/order` as they are. Field paths here (`missingFields`, `invalidFields`, `400`) use the bracket notation
        of `POST /v1/order/validate`, and address and shipment fields have the same paths there. Addons do not: this
        request keys them by category (`addons[CASH_ON_DELIVERY][bankAccountNumber]`), while `POST /v1/order` and
        `POST /v1/order/validate` take a list and report its position (`addons[0][bankAccountNumber]`) — the position
        is the one of the addon with that category in the offer's `addons` (`addonDetails` gives each one's category).

        Payment methods NKO and COUPON cannot be quoted (the NKO insurance depends on the order's own price).
        Addons the order attaches by itself (customs clearance fee, Exporter of Record, transport paid by the
        receiver, remote-area surcharges) cannot be requested — they are already in `pricing`.
        Prices follow the caller's price group; the currency is `X-Currency`, otherwise the client's payment
        currency (PLN without a token). A guest may send `account` — the account it would register — to be quoted
        that account's prices instead of the guest ones.

        **Customs:** a `customs` declaration is priced the way `POST /v1/order` prices it. Its value
        (the commodities' `subTotalValue`, converted) is the declared value, also of a requested `DECLARED_VALUE` addon,
        as `GET /v1/order/price` takes it — send the declared value addon or `declaredValue` to `POST /v1/order`
        too, which substitutes the declaration's value only into one of them.
        A client settling duties from its customs prepaid account (clearance PREMIUM) gets, on a route outside the
        EU, the DDP/DAP Premium addon the order adds by itself, priced from the landed cost of the declaration, with the
        customs clearance fee it brings; the calculation is stored, so the order of the same shipment reuses it.
        Each offer checks the declaration against its own form and reports the rejected fields in `invalidFields`.
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/XCurrency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductQuoteRequest'
            example:
              senderAddress:
                countryId: 1
                postCode: 00-001
                city: Warszawa
              receiverAddress:
                countryId: 1
                postCode: 31-001
              shipment:
                length: 30
                width: 20
                height: 10
                weight: 2.5
                quantity: 1
              collectionType: PICKUP
              paymentId: 1
              receiverType: PERSON
              addons:
                CASH_ON_DELIVERY:
                  value: 800
                SMS_ON_DELIVERY: {}
      responses:
        '200':
          description: Offers, the cheapest first, and hints for products a change to the request would bring in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductQuoteResult'
              example:
                offers:
                - product:
                    id: 333
                    carrierName: DPD
                    packageType: PARCEL
                  addons:
                  - id: 3334
                    value: 800
                  - id: 3331
                  - id: 3332
                    value: 800
                  pricing:
                    currency: PLN
                    totalNetPrice: 146
                    totalGrossPrice: 179.58
                  customsDeclaration: null
                  missingFields:
                  - pickup[date]
                  - receiverAddress[street]
                  - receiverAddress[houseNumber]
                  - receiverAddress[phone]
                  - addons[CASH_ON_DELIVERY][bankAccountNumber]
                  invalidFields: []
                  fieldLimits:
                    senderAddress:
                      name: 100
                      street: 150
                      houseNumber: 50
                      apartmentNumber: 50
                      addressLine:
                        fields: streetHouseApartment
                        maxLength: 100
                    receiverAddress:
                      name: 100
                      street: 150
                      houseNumber: 50
                      apartmentNumber: 50
                      addressLine:
                        fields: streetHouseApartment
                        maxLength: 100
                hints:
                - carrierName: GLS
                  product:
                    id: 444
                    name: Parcel
                  options:
                  - - action: LOWER_VALUE
                      category: CASH_ON_DELIVERY
                      maxValue: 500
                      currency: PLN
                  - - action: UNCHECK
                      category: CASH_ON_DELIVERY
                customsDeclarationConfigs: {}
        '400':
          description: |
            Validation failed. Besides the usual field errors: `addons[<CATEGORY>][value]` is missing for a
            value-bearing category, `addons[<CATEGORY>]` names a category that does not exist or that the order adds
            by itself, `account` is sent with a token (`A signed-in client is quoted on its own account.`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                fields:
                  addons[INSURANCE][value]: This field is missing.
                  addons[CUSTOMS_CLEARANCE_FEE]: This addon category is added to the order automatically and cannot be requested.
      security:
      - {}
      - tokenAuth: []
  /v1/report/order:
    get:
      operationId: reportGetOrderHistory
      tags:
      - Reports
      summary: Get order history report
      description: 'Number of the account''s orders per period (`step`) and carrier between `dateFrom` and `dateTo` (inclusive).

        `date` is `YYYY-MM-DD` for `day`, `YYYY WW` (ISO week) for `week` and `YYYY-MM` for `month`.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: step
        in: query
        required: true
        schema:
          type: string
          enum:
          - day
          - week
          - month
      - name: dateFrom
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: dateTo
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: carrier[]
        in: query
        description: Carrier integration names; all carriers when omitted.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: Report rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportOrderHistoryRow'
              example:
              - total: '1'
                date: '2025-01-01'
                carrierName: DHL
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/report/order/cod:
    get:
      operationId: reportGetCashOnDelivery
      tags:
      - Reports
      summary: Get cash-on-delivery report
      description: 'Cash-on-delivery orders of the account with collection status and payout dates. At least one date filter
        pair is

        required (order date, payout date `returnDate*` or expected payout date `returnDateExpected*`).

        Response format depends on `Accept`: one of the CSV types returns a CSV attachment (`404` when there are no rows);

        anything else returns a paginated JSON list. `remainingDays` counts the days left until the expected payout.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: Accept
        in: header
        schema:
          type: string
          enum:
          - application/json
          - text/csv
          - application/vnd.ms-excel
          - application/csv
          - text/x-csv
          - text/plain
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: dateFrom
        in: query
        description: Order date from.
        schema:
          type: string
          format: date
      - name: dateTo
        in: query
        description: Order date to.
        schema:
          type: string
          format: date
      - name: returnDateFrom
        in: query
        description: COD payout date from.
        schema:
          type: string
          format: date
      - name: returnDateTo
        in: query
        description: COD payout date to.
        schema:
          type: string
          format: date
      - name: returnDateExpectedFrom
        in: query
        description: Expected payout date from.
        schema:
          type: string
          format: date
      - name: returnDateExpectedTo
        in: query
        description: Expected payout date to.
        schema:
          type: string
          format: date
      - name: currency
        in: query
        schema:
          $ref: '#/components/schemas/ProductCurrency'
      - name: codValue
        in: query
        description: COD amount.
        schema:
          type: number
          minimum: 0
      - name: carrier[]
        in: query
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: transportType
        in: query
        schema:
          type: string
          enum:
          - ROAD
          - AIR
          - CROSSBORDER
          - NON_CROSSBORDER
      - name: status[]
        in: query
        description: Shipment statuses (list only).
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: '#/components/schemas/OrderShipmentStatus'
      - name: codStatus[]
        in: query
        description: COD statuses, e.g. WAITING_FOR_DELIVERY, WAITING_FOR_TRANSFER (list only).
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
      - name: receiverCountryId
        in: query
        schema:
          type: integer
      - name: receiver
        in: query
        description: Part of the receiver name, matched case-insensitively anywhere in the name. Unlike the `receiver` filter of
          the order list, which also looks at the city, address and phone, this one matches the name only. `%`, `_` and `\` are
          matched literally. Spaces around the phrase are ignored; a phrase that is empty after trimming is rejected (`400`).
          The length limit counts the phrase as sent. Applies to the JSON list and the CSV file.
        schema:
          type: string
          minLength: 1
          maxLength: 64
      responses:
        '200':
          description: JSON page or CSV file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCashOnDeliveryPage'
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: CSV requested and there are no matching rows.
  /v1/report/order/cod/subscription:
    get:
      operationId: reportGetCodSubscription
      tags:
      - Reports
      summary: Get COD report e-mail subscription
      description: 'Recurring e-mail with the COD payout report is an account-level setting (main account). `email` is null
        when the

        subscription is off. Not available to sub-accounts.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Subscription state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportCodSubscription'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: reportPutCodSubscription
      tags:
      - Reports
      summary: Enable COD report e-mail subscription
      description: Sets the recipient address and enables the subscription (overwrites a previous address). Not available
        to sub-accounts.
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 100
                  example: jan.kowalski@example.com
      responses:
        '204':
          description: Subscription saved and enabled.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: reportDeleteCodSubscription
      tags:
      - Reports
      summary: Disable COD report e-mail subscription
      description: Disables the subscription; idempotent. Not available to sub-accounts.
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '204':
          description: Subscription disabled.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/report/order/status:
    get:
      operationId: reportGetOrderStatusCsv
      tags:
      - Reports
      summary: Export order statuses as CSV
      description: 'CSV export (attachment) of all orders matching the `GET /v1/orders` filters, unpaginated, with columns

        `number, status` (translated), `trackingNumber, pickupDate, deliveryDate, userEmail`. The response `Content-Type`

        equals the request `Accept` header, which therefore must be sent. Returns `404` when no order matches.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: Accept
        in: header
        required: true
        schema:
          type: string
          example: text/csv
      - name: filters
        in: query
        description: Same `filters[...]` parameters as `GET /v1/orders`.
        style: deepObject
        explode: true
        schema:
          type: object
          additionalProperties: true
      responses:
        '200':
          description: CSV file.
          content:
            text/csv:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No orders match the filters.
  /v1/report/salesMargin:
    get:
      operationId: reportGetSalesMargin
      tags:
      - Reports
      summary: Get sales margin report
      description: 'Paginated list of orders with the reseller margin earned on each, plus `netAmount` and `margin` totals
        for the

        returned page. `filters[subUserId]` narrows to one sub-account of the caller.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: filters[dateFrom]
        in: query
        schema:
          type: string
          format: date
      - name: filters[dateTo]
        in: query
        schema:
          type: string
          format: date
      - name: filters[subUserId]
        in: query
        schema:
          type: integer
      responses:
        '200':
          description: Margin report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSalesMargin'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/report/salesMargin/confirmation:
    get:
      operationId: reportGetOrderConfirmation
      tags:
      - Reports
      summary: Get order confirmation
      description: 'Order placement confirmation as a PDF (default) or JSON. Identify the order by `hash`, or by `carrierNumber`
        when no

        hash is given (one of them is required; `hash` wins when both are sent).

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: hash
        in: query
        description: Order hash (required when `carrierNumber` is not given).
        schema:
          type: string
      - name: carrierNumber
        in: query
        description: Carrier tracking number (required when `hash` is not given).
        schema:
          type: string
      - name: type
        in: query
        schema:
          type: string
          enum:
          - pdf
          - json
          default: pdf
      responses:
        '200':
          description: Confirmation document.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: '#/components/schemas/ReportOrderConfirmation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/report/user/cod:
    get:
      operationId: reportGetUserCodSummaryR02
      tags:
      - Reports
      summary: Get COD shipment statistics
      description: 'Sums of cash-on-delivery amounts of the caller''s orders in one currency, split by state. An unknown or
        missing

        `currency` silently falls back to `PLN`. Dates are optional and bound the order date range.

        '
      x-proxied-to: /public/v2/report/user/cod
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: currency
        in: query
        required: false
        schema:
          type: string
          enum:
          - PLN
          - EUR
          - USD
          - GBP
          - CZK
          - HUF
          - RON
          - RUB
          default: PLN
      - name: dateFrom
        in: query
        required: false
        schema:
          type: string
          format: date
        example: '2026-01-01'
      - name: dateTo
        in: query
        required: false
        schema:
          type: string
          format: date
        example: '2026-01-31'
      responses:
        '200':
          description: COD amounts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportUserCodV2'
              example:
                total: 300.5
                inTransit: 100.0
                deliveredReturned: 150.5
                deliveredNotReturned: 50.0
                currency: PLN
        '400':
          description: Date not in `Y-m-d` format, or unknown query parameter (`general` string).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderProxyErrorV2'
              example:
                fields:
                  dateFrom: This value is not a valid date.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/report/user/volume:
    get:
      operationId: reportGetUserVolumeDeclarationR02
      tags:
