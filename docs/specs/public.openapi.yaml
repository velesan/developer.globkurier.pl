              value:
                type: number
                nullable: true
                description: Addon value (e.g. cash on delivery amount, insured value).
                example: 810
              valueCurrency:
                type: string
                example: PLN
        customs:
          type: object
          additionalProperties: true
          description: Customs declaration data stored with the draft.
        collectionType:
          type: string
          enum:
          - PICKUP
          - POINT
        pickup:
          type: object
          properties:
            pickupDate:
              type: string
            pickupTimeFrom:
              type: string
            pickupTimeTo:
              type: string
        createDate:
          type: string
          example: '2024-01-31 12:00:00'
    OrderDraftPoint:
      type: object
