    OrderProxyErrorV2:
      type: object
      description: 'Error envelope of the v2 service, passed through unchanged by gk. Shapes: `fields` (field path => message),
        `general`

        (a string from form/scalar validation, a list of strings from HTTP exceptions, or `{"message": ...}` for an

        unsupported `Accept-Language`), `message`, `error`. Many 401/403/404 answers have an empty body instead.

        '
      properties:
        fields:
          type: object
          additionalProperties:
            type: string
        general:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
          - type: object
            properties:
              message:
                type: string
        message:
          type: string
        error:
          oneOf:
          - type: string
          - type: object
            additionalProperties:
              type: string
