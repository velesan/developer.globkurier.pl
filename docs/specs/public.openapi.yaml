              schema:
                type: string
                format: binary
        '400':
          description: 'Validation error (incl. changed immutable value), or `general`: `Order was not found.` / `Cannot modify
            invoice for order with given status.`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Invoice with this id does not exist (empty body).
    delete:
      operationId: customsDeleteInvoiceR01
      tags:
      - Customs
      summary: Delete the customs invoice
      description: Deletes an invoice. The order must belong to the logged-in user and be IN_PROGRESS or IN_TRANSIT.
      x-proxied-to: /public/v2/customsDocument/invoice/{id}
      parameters:
