        required.
      properties:
        type:
          type: string
          enum:
          - PERSON
          - COMPANY
        name:
          type: string
          minLength: 3
          maxLength: 30
        surname:
          type: string
          minLength: 3
          maxLength: 30
        companyName:
          type: string
          minLength: 3
          maxLength: 255
          description: Required for `COMPANY`. For EU companies must match the registry name.
        nip:
          type: string
          description: Tax identification number. Required for `COMPANY`; must be valid for the country and not used by another
            active account.
        regon:
          type: string
          description: Ignored, kept for backward compatibility.
        street:
          type: string
          minLength: 1
          maxLength: 35
        houseNumber:
          type: string
          minLength: 1
          maxLength: 20
        apartmentNumber:
          type: string
          minLength: 1
          maxLength: 20
        postCode:
          type: string
          maxLength: 10
          description: Required when the country uses post codes; validated and normalized to the country format.
        city:
          type: string
          minLength: 3
          maxLength: 35
        countryId:
          type: integer
          description: Country identifier from `/v1/countries`.
        phone:
          type: string
          description: Mobile phone number.
        email:
          type: string
          format: email
          description: Login e-mail; must not be used by another account.
    UserRegistrationRequest:
      type: object
      required:
      - password
      - address
      - agreements
      properties:
        password:
          type: string
          minLength: 6
          description: At least 6 characters with a lowercase letter, an uppercase letter and a digit.
        address:
          $ref: '#/components/schemas/UserRegistrationAddress'
        agreements:
