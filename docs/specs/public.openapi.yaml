                type: string
                nullable: true
              message:
                type: string
              parameters:
                type: object
                additionalProperties: true
        errorCodes:
          type: object
          description: Field path => stable, machine readable error code.
          additionalProperties:
            type: string
        general:
          type: array
          description: Errors not bound to a single field.
          items:
            type: string
      example:
        general:
        - No such API method version.
