  /v1/product/addons:
    get:
      operationId: productGetAddons
      tags:
      - Products
      summary: Get addons for a product
      description: '**Rate limit: 1000 requests per clock hour per account (resets at the full hour; sub-accounts count towards their
        main account) and 40 per second per session (auth token)**; above it 429. The endpoint serves picking addons for a chosen product, not scanning the offer: an
        integration that needs more talks to GlobKurier first.

        Addons available for the given product and shipment, priced for the given parameters (`X-Currency`, default
        PLN).

        Client-side rules: an INSURANCE addon is required when a CASH_ON_DELIVERY addon or cash-on-delivery payment is chosen,

        and its value must be >= the COD value; at most one addon per group: INSURANCE, CASH_ON_DELIVERY, and

        SATURDAY_DELIVERY/EVENING_DELIVERY/LATE_EVENING_DELIVERY. `requiredAlternativeAddonsGroups` lists groups of addon
        ids of

        which at least one must be selected for the order to be accepted.

        Without `insuranceValue`/`cashOnDeliveryValue`, prices are computed for the lowest possible amount.

        Post codes are required for countries that use them (`hasPostCodes`) and are validated against the country format.

        For a route that is neither domestic nor intra-EU, duty addon categories that the product does not offer are appended

        as zero-priced placeholder addons (synthetic ids), so the client can always present every Incoterm.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/XCurrency'
      - name: productId
        in: query
        required: true
        description: Product id from `GET /v1/products`.
        schema:
          type: integer
      - name: length
        in: query
        required: true
        description: Length [cm].
        schema:
          type: integer
          minimum: 1
      - name: width
        in: query
        required: true
        description: Width [cm].
        schema:
          type: integer
          minimum: 1
      - name: height
        in: query
        required: true
        description: Height [cm].
        schema:
          type: integer
          minimum: 1
      - name: weight
        in: query
        required: true
        description: Weight [kg], max 2 decimal places.
        schema:
          type: number
      - name: quantity
        in: query
        required: true
        description: Number of packages/pallets.
        schema:
          type: integer
          minimum: 1
      - name: senderCountryId
        in: query
        required: true
        description: Sender country id from `GET /v1/countries`.
        schema:
          type: integer
      - name: receiverCountryId
        in: query
        required: true
        description: Receiver country id from `GET /v1/countries`.
        schema:
          type: integer
      - name: senderPostCode
        in: query
        description: Sender post code; required when the country uses post codes.
        schema:
          type: string
          maxLength: 10
      - name: receiverPostCode
        in: query
        description: Receiver post code; required when the country uses post codes.
        schema:
          type: string
          maxLength: 10
      - name: senderCity
        in: query
        schema:
          type: string
          maxLength: 50
      - name: receiverCity
        in: query
        schema:
          type: string
          maxLength: 50
      - name: senderStateId
        in: query
        description: State id from `GET /v1/states`.
        schema:
          type: integer
      - name: receiverStateId
        in: query
        description: State id from `GET /v1/states`.
        schema:
