      responses:
        '200':
          description: Template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomsDeclarationTemplateV2'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such template in the account family (empty body).
  /v1/order/customsTemplate:
    get:
      operationId: customsListOrderTemplatesR02
