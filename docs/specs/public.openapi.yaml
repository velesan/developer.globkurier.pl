      summary: Get states for a country
      description: 'States/regions of a country. Needed when `GET /v1/order/customRequiredFields` says the sender or receiver
        state is

        required when creating or validating an order. Countries without states are rejected. Available without authentication.

        '
      x-proxied-to: /public/v2/states
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: countryId
        in: query
        required: true
