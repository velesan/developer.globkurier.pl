  /v1/integrations/tradePlatform/etsy/account/verify:
    get:
      operationId: integrationEtsyOAuthCallback
      tags:
      - Integrations
      summary: Etsy OAuth callback
      description: Redirect URI for the Etsy OAuth flow - called by the customer's browser. Exchanges `code` and `state` for
        tokens via hermes-2, verifies them, stores them for 10 minutes under `state` and redirects to the success return link
        (cookie `successReturnLink`, default panel page) with `etsy_oauth_ready=1&state=...`. On Etsy `error`, failed exchange
        or failed verification it redirects to the failure return link (cookie `failedReturnLink`).
      x-unverified: true
      parameters:
      - name: code
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: error
        in: query
        required: false
        schema:
          type: string
      responses:
        '302':
          description: Redirect to the panel success or failure return link.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '500':
          description: 'Returned instead of a JSON error when `code`/`state` are missing or the request asks for JSON (`Accept:
            application/json`, `X-Requested-With`, `format=json`) - see discrepancies.'
      security:
      - {}
      - tokenAuth: []
    post:
      operationId: integrationEtsyVerify
      tags:
      - Integrations
      summary: Start Etsy OAuth or verify Etsy credentials
      description: 'Two modes. (1) Empty body (no `code`, `state`, `error`, credentials): starts the Etsy OAuth procedure
        - for a JSON request returns `authorize_url` and `state`, otherwise redirects to Etsy; sets cookies `token`, `etsyOAuthState`,
        `lang`, `tradePlatformLabel`, `successReturnLink`, `failedReturnLink`, `operationMode` (15 min). Return links are
        accepted only on the panel host. (2) Body with credentials (object `credentials` or flat OAuth fields): verifies them
        in hermes-2; a JSON request gets the normalized credentials back, otherwise an empty array. A body with `code`/`state`/`error`
        but no credentials is refused with `unsupported_method`.'
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationEtsyVerifyRequest'
      responses:
        '200':
          description: OAuth started (mode 1) or credentials accepted (mode 2).
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/IntegrationEtsyOAuthInitResponse'
                - $ref: '#/components/schemas/IntegrationEtsyCredentialsResponse'
                - $ref: '#/components/schemas/IntegrationEmptyResponse'
        '302':
          description: Non-JSON request - redirect to the Etsy authorize page, or to the failure return link when start failed.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          description: 'Credentials rejected (JSON request: hermes-2 error body; otherwise `fields.token`), `unsupported_method`,
            or `unknown_error` when the OAuth start failed.'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/IntegrationUpstreamError'
      security:
      - {}
      - tokenAuth: []
