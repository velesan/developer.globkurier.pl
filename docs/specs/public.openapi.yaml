        ratio:
          type: number
          description: Commission rate on order value (1 = 100%).
          example: 0.04
    PartnerProgramMonthlyCounter:
      type: object
      properties:
        all:
          type: number
          description: Total since joining the program.
        monthly:
          type: object
          description: Values per month (`YYYY-MM` keys) for the last 12 months, newest first.
          additionalProperties:
            type: number
          example:
            2025-02: 3
            2025-01: 0
    PartnerProgramSummary:
      type: object
