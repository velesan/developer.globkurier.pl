          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
              example:
                general:
                - Order was not found.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Invoice with this id does not exist (empty body).
