              $ref: '#/components/schemas/OrderGroupOrdersRequest'
      responses:
        '204':
          description: Added.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Group not found in the account (empty body).
    delete:
      operationId: orderGroupRemoveOrders
      tags:
      - Order Groups
