  /v1/orders/statistics:
    get:
      operationId: orderGetStatisticsMetrics
      tags:
      - Orders
      summary: Get dashboard order metrics
      description: 'Returns the requested dashboard metrics (customs and cross-border tiles) for the account, keyed by metric
        name.

        Each metric is computed over the whole account (a sub-account restricted to its own orders sees only those), so at
        most

        10 metrics may be requested at once. Cross-border metrics carry a translated `label`; customs ones do not.

        Value shape depends on `type`: `count` -> `value`; `countWithVolume` -> `value` out of `volume`; `money` -> `values`

        (amount per currency).

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: metrics[]
        in: query
