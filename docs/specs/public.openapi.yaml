    ZohoCaseV2:
      type: object
      description: One case (Zoho CRM record or Zoho Desk ticket). Complaint-only fields are present only for complaint modules.
      properties:
        id:
          type: string
        Type:
          type: string
          description: Submission type label (e.g. `Pytanie`, `Inne`).
        Numer_GK:
          type: string
          nullable: true
        Status_PK:
          type: string
          description: Raw status from Zoho.
        Description:
          type: string
          nullable: true
        Wiadomo_do_klienta:
          type: string
          nullable: true
          description: Message/resolution for the client.
        Created_Time:
          type: string
          format: date-time
        Modified_Time:
          type: string
          format: date-time
        Attachments:
          type: array
          items:
            $ref: '#/components/schemas/ZohoCaseAttachmentV2'
