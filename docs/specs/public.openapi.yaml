        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: 'Rate limit exceeded: a signed-in account may send up to 1000 of these requests per hour
            (sub-accounts count towards their main account) and each session (auth token) up to 40 per second. The JSON
            body names the limit that was hit, translated by Accept-Language; retry after the number of seconds in the
            Retry-After header (to the end of the second or of the hour). The first shipment sent through an integration
            lifts the hourly quota of the account; it can also be asked for with POST /v1/user/apiQuotaExemption.
            Anonymous callers fall under the per-IP limit of the API, 60 requests per minute, answered with an empty body.'
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - {}
      - tokenAuth: []
