        localName:
          type: string
          example: Alaska
    UserProxyErrorV2:
      type: object
      description: 'Error envelope of the minotaur v2 service, passed through unchanged by gk. Validation errors use `fields`
        (field path → message,

        nested paths written as `a[b]`, e.g. `contact[name]`); other errors use `general`, which depending on the source is
        a string,

        an array of strings, or (unsupported `Accept-Language`) an object with `message`.

        '
      properties:
        fields:
          type: object
          additionalProperties:
            type: string
        general:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
          - type: object
            properties:
              message:
                type: string
      example:
        fields:
          contact[name]: This value is too short. It should have 2 characters or more.
    UserProxyAuthErrorV2:
      type: object
      description: Returned by the v2 service when an `X-Auth-Token` header is present but not valid.
      properties:
        error:
          oneOf:
          - type: object
            properties:
              token:
                type: string
          - type: string
      example:
        error:
          token: Invalid or expired
    AddressBookContactInputV2:
      type: object
      description: 'Contact data. Effective validation (after street splitting and phone normalisation): `name` 2–150, `houseNumber`
        1–50,

        `postCode` not blank, `city` 3–50, `phone` 9–25 after normalisation (error key `contact[phoneNumber]`), `street` max
        150,

        `email` must be a valid e-mail when given.

        '
      required:
      - countryId
      - name
      - postCode
      - city
      - phone
      properties:
        countryId:
          description: Country id; on create/import also a country name (PL/EN) or zone code.
          oneOf:
          - type: integer
          - type: string
          example: 1
        name:
          type: string
          minLength: 2
          maxLength: 150
          example: Jan Kowalski
        street:
          type: string
          maxLength: 150
          description: Street; if sent without `houseNumber`, house and apartment numbers are extracted from it.
          example: Testowa
        houseNumber:
          type: string
          maxLength: 50
          description: Required unless it can be extracted from `street`.
          example: '1'
        apartmentNumber:
          type: string
          example: '2'
        postCode:
          type: string
          example: 00-001
        city:
          type: string
          minLength: 3
          maxLength: 50
          example: Warszawa
        email:
          type: string
          format: email
          example: jan.kowalski@example.com
        phone:
          type: string
          example: '123456789'
        tin:
          type: string
          example: '1234567890'
        contactPerson:
          type: string
          example: Jan Kowalski
        shortName:
          type: string
          nullable: true
          maxLength: 30
          description: Short form of the name for the carrier, optional. Surrounding spaces are cut; an empty
            string or `null` means none.
        default:
          type: boolean
          default: false
          description: Marks the contact as the client's default contact (listed first). One default contact per client in each
            book (senders, receivers), so `true` unmarks the previous default. When the contact already exists (duplicate),
            `true` marks the existing contact as the default instead of creating a copy. Also accepts `1`/`0`/`"true"`/`"false"`
            (case-insensitive); any other value, an empty string included, returns `400` with `fields["contact[default]"]`. Not
            read by import.
          example: true
        favorite:
          type: boolean
          default: false
          description: Marks the contact as a favorite (listed after the default contact). Any number of favorites per client in
            each book (senders, receivers); independent of `default`, and marking one does not unmark the others. When the
            contact already exists (duplicate), `true` marks the existing contact as a favorite instead of creating a copy. Also
            accepts `1`/`0`/`"true"`/`"false"` (case-insensitive); any other value, an empty string included, returns `400` with
            `fields["contact[favorite]"]`. Not read by import.
          example: true
    AddressBookCreateRequestV2:
      type: object
      required:
      - contact
      properties:
        contact:
          $ref: '#/components/schemas/AddressBookContactInputV2'
    AddressBookContactUpdateInputV2:
      type: object
      description: Partial contact update — omitted or empty fields keep their stored values, except default and favorite,
        where an empty string returns 400. Same field rules as on create.
      required:
      - id
      properties:
        id:
          type: string
          pattern: ^\d+$
          description: Contact id as a string of digits.
          example: '123'
        countryId:
          type: integer
          description: Country id (no name lookup on edit).
          example: 1
        name:
          type: string
          minLength: 2
          maxLength: 150
        street:
          type: string
          maxLength: 150
        houseNumber:
          type: string
          maxLength: 50
        apartmentNumber:
          type: string
        postCode:
          type: string
        city:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
        phone:
          type: string
        tin:
          type: string
        contactPerson:
          type: string
        shortName:
          type: string
          nullable: true
          maxLength: 30
          description: Short form of the name for the carrier, optional. On `PUT` a value that is not sent keeps the stored
            one, an empty string or `null` clears it. Surrounding spaces are cut.
        default:
          type: boolean
          nullable: true
          description: '`true` makes the contact the client''s default contact and unmarks the previous default in the same book;
            `false` unmarks it; omitted (or `null`) keeps the stored value. Also accepts `1`/`0`/`"true"`/`"false"` (case-insensitive);
            any other value, an empty string included, returns `400` with `fields["contact[default]"]`.'
          example: true
        favorite:
          type: boolean
          nullable: true
          description: '`true` marks the contact as a favorite and `false` removes the mark; other contacts and `default` are not
            changed. Omitted (or `null`) keeps the stored value. Also accepts `1`/`0`/`"true"`/`"false"` (case-insensitive);
            any other value, an empty string included, returns `400` with `fields["contact[favorite]"]`.'
          example: true
    AddressBookUpdateRequestV2:
      type: object
      required:
      - contact
      properties:
        contact:
          $ref: '#/components/schemas/AddressBookContactUpdateInputV2'
    AddressBookContactV2:
      type: object
      properties:
        id:
          type: integer
          example: 123
        name:
          type: string
          example: Jan Kowalski
        email:
          type: string
          nullable: true
          example: jan.kowalski@example.com
        street:
          type: string
          nullable: true
          example: Testowa
        houseNumber:
          type: string
          nullable: true
          example: '1'
        apartmentNumber:
          type: string
          nullable: true
          example: '2'
        postCode:
          type: string
          nullable: true
          example: 00-001
        city:
          type: string
          nullable: true
          example: Warszawa
        countryId:
          type: integer
          nullable: true
          example: 1
        phone:
          type: string
          nullable: true
          example: '+48123456789'
        contactPerson:
          type: string
          nullable: true
        tin:
          type: string
          nullable: true
        shortName:
          type: string
          nullable: true
          description: Short form of the name for the carrier; `null` when none is set.
        default:
          type: boolean
          example: false
        favorite:
          type: boolean
          example: false
        editable:
          type: boolean
          description: Always `true`.
          example: true
