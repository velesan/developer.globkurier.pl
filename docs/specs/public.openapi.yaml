        labelsToOtherEmail:
          type: string
          format: email
          maxLength: 100
          nullable: true
          description: Address labels are sent to.
    InvoiceListPage:
      type: object
      properties:
        offset:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
    Invoice:
      type: object
      properties:
        hash:
          type: string
          description: Document identifier.
        link:
          type: string
          description: Download link of the document.
        number:
          type: string
