  /v1/customs/config:
    get:
      operationId: customsGetDeclarationConfigR01
      tags:
      - Customs
      summary: Get the customs declaration form configuration
      description: 'Returns the dynamic customs declaration form for a carrier and route: `sections`, `fields` (with nested

        `fields`, `options`, `constraints` and validation `pattern`) and `calculationMapping`.

        The carrier is given by exactly one of `name` or `productId` (product resolved to its carrier). Any query

        parameter not listed here returns `400`. Labels, placeholders, tooltips and option names are translated

        according to `Accept-Language` (fallback `en`).

        gk post-processes a `200` (`customsConfig` action): for a logged-in customer with an EORI number on file, the

        empty `eori` child field of the `sender` or `receiver` group - the party whose country matches the EORI country

        prefix (`XI` counts as `GB`; sender checked first) - is pre-filled with that number; a value from the

        configuration is never overwritten. Available without authentication (then nothing is pre-filled).

        '
      x-proxied-to: /public/v2/customs/config
      parameters:
      - name: name
        in: query
        required: false
        description: Carrier name. Exactly one of `name` or `productId` is required.
        schema:
          type: string
        example: DHL
      - name: productId
        in: query
        required: false
        description: Product ID, resolved to its carrier. Exactly one of `name` or `productId` is required.
        schema:
          type: integer
          minimum: 1
        example: 123
      - name: senderCountry
        in: query
        required: true
        description: Sender country ID from `GET /v1/countries`.
        schema:
          type: integer
          minimum: 1
        example: 1
      - name: receiverCountry
        in: query
        required: true
        description: Receiver country ID from `GET /v1/countries`.
        schema:
          type: integer
          minimum: 1
        example: 2
      - name: content
        in: query
        required: false
        description: Shipment content, used to decide whether customs clearance is required (e.g. documents).
        schema:
          type: string
        example: Documents
      - name: incoterm
        in: query
        required: false
        deprecated: true
        description: Accepted for backward compatibility only and ignored.
        schema:
          type: string
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Form configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomsDeclarationConfigV2'
              example:
                sections:
                - sender
                - commodities
                - summary
                fields:
                - label: null
                  type: null
                  placeholder: null
                  name: sender
                  value: null
                  required: true
                  tooltip: null
                  multi: null
                  expanded: null
                  disabled: false
                  min: null
                  max: null
                  precision: null
                  suffix: null
                  section: null
                  frontType: null
                  customFunctions: []
                  style: null
                  compound: true
                  options: null
                  pattern: null
                  constraints: []
                  fields:
                  - label: Sender EORI number
                    type: text
                    placeholder: EORI
                    name: eori
                    value: PL0000000000000
                    required: true
                    tooltip: null
                    multi: null
                    expanded: null
                    disabled: false
                    min: null
                    max: null
                    precision: null
                    suffix: null
                    section: sender
                    frontType: text
                    customFunctions: []
                    style: null
                    compound: false
                    options: null
                    pattern: null
                    constraints:
                    - class: Symfony\Component\Validator\Constraints\Length
                      arguments:
                        min: '1'
                        max: '20'
                    fields: []
                calculationMapping: {}
        '400':
          description: Neither or both of `name`/`productId`, missing/invalid country, unknown query parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
              examples:
                carrierMissing:
                  value:
                    general: One of the parameters name or productId is required.
                countryMissing:
                  value:
                    fields:
                      senderCountry: This value should not be blank.
        '404':
          description: No configuration for the carrier/route, or the product is unknown.
          content:
            application/json:
              schema:
