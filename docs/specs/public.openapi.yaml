      properties:
        accountNumber:
          type: string
          maxLength: 34
          description: IBAN (validated).
          example: PL00000000000000000000000000
        accountName:
          type: string
          maxLength: 30
          description: Letters, digits, space and `- ' . , @ & ( ) /`.
        accountAddress:
          type: string
          maxLength: 30
          description: Letters, digits, whitespace and `# . , - / & ' "`.
        accountAddressContinued:
