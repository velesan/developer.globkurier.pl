          description: Whether the method can be used now.
        default:
          type: boolean
          description: 'Method to preselect for the order: the payment method saved by the user (`GET /v1/user/payment/default`;
            a sub-account without its own saved method uses the one of its main account), but only while it is enabled;
            otherwise the default method of the payment configuration. The configured default is not checked for
            availability, so preselect only a method with `default` and `enabled` both true. Granting a credit limit saves
            the collective invoice (4) as the default payment method, so after the user clears it, 4 stays enabled within
            the limit but is no longer the default.'
