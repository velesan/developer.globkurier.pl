          type: string
        vatPercent:
          type: number
        totalGrossPrice:
          type: number
        totalNetPrice:
          type: number
        netPriceWithoutFuelSurcharge:
          type: number
        productNetPrice:
          type: number
        productsNetPrice:
          type: number
        productsGrossPrice:
          type: number
        productsStockNetPrice:
          type: number
