        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/user/agreements/other:
    put:
      operationId: userUpdateOtherAgreements
      tags:
      - User
      summary: Update agreements not tied to a channel
      description: 'Synchronizes the account''s dashboard agreements that have no communication channel. Same rules as the
        e-mail

        variant. Typical codes: `sendDiscountCodes`, `sendLabel`, `sendInfoOnSubAccountOrderCreation`,

        `sendInfoOnSubAccountProformaInvoiceCreation`, `sendInfoOnTrackingStatusUpdate`, `sendInfoOnOrderCreation`.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAgreementsUpdateRequest'
            example:
              agreements:
                sendLabel: true
      responses:
        '204':
          description: Agreements saved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/user/agreements/sms:
    put:
      operationId: userUpdateSmsAgreements
      tags:
      - User
      summary: Update SMS channel agreements
      description: 'Synchronizes the account''s agreements of the SMS channel. Same rules as the e-mail variant.

        Typical codes: `phoneCommercials`, `sendSmsOrderInTransitToMyCustomers`, `sendSmsOrderDeliveredToMyCustomers`.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAgreementsUpdateRequest'
            example:
              agreements:
                phoneCommercials: false
      responses:
        '204':
          description: Agreements saved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/user/blocking-status:
    get:
      operationId: userGetBlockingStatusR03
      tags:
      - User
      summary: Get the account's blocking status
      description: 'Returns whether the authenticated account is blocked and why. Reasons are recomputed on every call (and
        the stored reason is

        refreshed). A blocked account with no detected reason returns `OTHER`. `message` is always Polish, regardless of `Accept-Language`.

        Used e.g. by voicebots after obtaining a customer token.

        '
      x-proxied-to: /public/v2/user/blocking-status
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Blocking status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserBlockingStatusV2'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/user/captcha:
    get:
      operationId: userGetOriginCaptcha
      tags:
      - User
      summary: Get a one-time registration captcha for partners
      description: 'Returns a captcha value that a partner integration can send as `gRecaptchaResponse` in `POST /v1/user`
        instead of

        Google reCAPTCHA. Requires the partner (order origin) token issued by GlobKurier under contract. Each captcha is

        single-use. Anonymous only.

        '
      parameters:
      - name: token
        in: query
        required: true
        description: Partner (order origin) token received from GlobKurier.
        schema:
          type: string
      responses:
        '200':
          description: Captcha generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCaptcha'
              example:
                captcha: 0
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
  /v1/user/cod:
    get:
      operationId: userGetCodAccountR03
      tags:
      - User
      summary: Get one COD bank account
      description: 'Returns one cash-on-delivery (COD) bank account of the authenticated account, or — for a main account
        passing `subUserId` —

        of one of its sub-accounts.

        '
      x-proxied-to: /public/v2/user/cod
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: codId
        in: query
        required: true
        description: COD account id. Missing or non-integer returns `404`.
        schema:
          type: integer
      - name: subUserId
        in: query
        required: false
        description: Sub-account whose COD account to read (main accounts only).
        schema:
          type: integer
      responses:
        '200':
          description: COD account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCodV2'
        '400':
          description: '`general: ["User cod with ID 5 not found"]` or the account belongs to another user.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProxyErrorV2'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is a sub-account using `subUserId`, or `subUserId` is not a sub-account of the caller (empty
            body).
        '404':
          description: '`codId` missing/not an integer, or `subUserId` does not exist (empty body).'
    post:
      operationId: userCreateCodAccountR03
      tags:
      - User
      summary: Create a COD bank account
      description: 'Creates a COD bank account for the authenticated account (or, for a main account, for the sub-account
        given in `subUserId`).

        The body is ONE flat account object. `isDefault: true` clears the default flag of the owner''s other accounts in the
        same currency.

        The bank country is taken from `country` or, when absent, from the first two letters of the IBAN.

        '
      x-proxied-to: /public/v2/user/cod
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCodCreateRequestV2'
      responses:
        '201':
          description: COD account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCodCreatedV2'
        '400':
          description: 'Validation error (`fields`, e.g. `accountNumber`, `swiftCode`, `currency`, `isDefault`), invalid JSON

            (`general: ["Invalid request body."]`) or unknown country (`general: ["..."]`).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProxyErrorV2'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`subUserId` used by a sub-account, or not a sub-account of the caller (empty body).'
        '404':
          description: '`subUserId` does not exist (empty body).'
        '415':
          description: Body is not JSON (empty body).
    put:
      operationId: userUpdateCodAccountR03
      tags:
      - User
      summary: Update a COD bank account
      description: 'Replaces a COD bank account of the owner (caller, or `subUserId` for a main account). Full replace: optional
        fields that are

        omitted are stored as `null`. `isDefault: true` clears the default flag of the owner''s other accounts in the account''s

        current currency.

        '
      x-proxied-to: /public/v2/user/cod
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCodUpdateRequestV2'
      responses:
        '204':
          description: COD account updated.
        '400':
          description: 'Validation error (`fields`) or `general: ["User cod with ID 5 not found"]`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProxyErrorV2'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`subUserId` used by a sub-account, or not a sub-account of the caller (empty body).'
        '404':
          description: '`subUserId` does not exist (empty body).'
        '415':
          description: Body is not JSON (empty body).
    delete:
      operationId: userDeleteCodAccountR03
      tags:
      - User
      summary: Delete a COD bank account
      description: Deletes one COD bank account of the owner (caller, or `subUserId` for a main account).
      x-proxied-to: /public/v2/user/cod
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: codId
        in: query
        required: true
        description: COD account id. Missing or non-integer returns `404`.
        schema:
          type: integer
      - name: subUserId
        in: query
        required: false
        description: Sub-account owning the COD account (main accounts only).
        schema:
          type: integer
      responses:
        '204':
          description: COD account deleted.
        '400':
          description: '`general: ["User cod with ID 5 not found"]` or `general: ["User cod with ID 5 does not belong to user
            with ID 123"]`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProxyErrorV2'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`subUserId` used by a sub-account, or not a sub-account of the caller (empty body).'
        '404':
          description: '`codId` missing/not an integer, or `subUserId` does not exist (empty body).'
  /v1/user/cods:
    get:
      operationId: userListCodAccountsR03
      tags:
      - User
      summary: List COD bank accounts
      description: 'Lists the COD bank accounts of the authenticated account, or — for a main account passing `subUserId`
        — of that sub-account.

        Not paginated.

        '
      x-proxied-to: /public/v2/user/cods
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: subUserId
        in: query
        required: false
        description: Sub-account whose COD accounts to list (main accounts only).
        schema:
          type: integer
      responses:
        '200':
          description: COD accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserCodV2'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: '`subUserId` used by a sub-account, or not a sub-account of the caller (empty body).'
        '404':
          description: '`subUserId` does not exist or is not an integer (empty body).'
  /v1/user/cods/subUsers:
    get:
      operationId: userListSubUsersCodAccountsR03
      tags:
      - User
      summary: List COD bank accounts of all sub-accounts
      description: 'Main accounts only: returns the COD bank accounts of all sub-accounts of the caller in one flat list (the
        caller''s own accounts

        are not included and items do not say which sub-account they belong to). Not paginated.

        '
      x-proxied-to: /public/v2/user/cods/subUsers
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: COD accounts of all sub-accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserCodV2'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Caller is a sub-account (empty body).
  /v1/user/company:
    get:
      operationId: userGetCompanyR03
      tags:
      - User
      summary: Look up company data by TIN
      description: 'Looks up a company by tax identification number, e.g. to prefill registration. Poland is queried in GUS
        (with a VIES fallback);

        other countries in VIES. Available without a token. Any query parameter other than `countryId` and `tin` is rejected
        with

        `400` (`general: "This form should not contain extra fields."`).

        '
      x-proxied-to: /public/v2/user/company
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: countryId
        in: query
        required: true
        description: Country id (from `/v1/countries`).
        schema:
          type: integer
          minimum: 1
          example: 1
      - name: tin
        in: query
        required: true
        description: Tax identification number (or EU VAT number), 2–25 characters, validated for the country.
        schema:
          type: string
          minLength: 2
          maxLength: 25
          example: '1234567890'
      responses:
        '200':
          description: Company data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCompanyV2'
        '204':
          description: The country is not covered by VIES (no lookup possible).
        '400':
          description: '`fields.countryId` / `fields.tin` validation error (blank, unknown country, TIN invalid for the country).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProxyErrorV2'
        '401':
          description: An `X-Auth-Token` was sent but is invalid or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProxyAuthErrorV2'
        '404':
          description: Company not found (body `[]`).
      security:
      - {}
      - tokenAuth: []
  /v1/user/couponStats:
    get:
      operationId: userGetCouponStats
      tags:
      - User
      summary: Get usage statistics of a granted coupon
      description: 'Returns whether an order can currently be paid with the given coupon and its usage limits for the (main)
        account.

        Fields other than `isCouponPaymentAvailable` are present only when the coupon is granted to the account; `period`

        only when a periodic limit applies. Day-of-month limits are combined with OR.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: couponId
        in: query
        required: true
        description: Coupon identifier.
        schema:
          type: integer
          minimum: 1
        example: 123
      responses:
        '200':
          description: Coupon statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCouponStats'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/user/creditLimit/activate:
    post:
      operationId: userActivateCreditLimit
      tags:
      - User
      summary: Activate the initial deferred-payment credit limit
      description: 'Activates the starter deferred-payment (trade credit) limit for the logged-in main account: 500 PLN with
        7 days

        payment term. Activation is recorded immediately and propagated asynchronously; the response returns `202`.

        Activation also saves the collective invoice with deferred payment (`paymentId` 4) as the default payment method
        of the account, replacing a method saved earlier; the saved online payment channel is kept.

        It can be done only once per account (`409` afterwards). No request body.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '202':
          description: Activation accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreditLimitActivation'
              example:
                creditLimit: 500
                deferredDays: 7
                currency: PLN
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Deferred credit limit already activated for this account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                general:
                - Deferred credit limit is already activated for this user.
  /v1/user/currency:
    patch:
      operationId: userUpdateCurrency
      tags:
      - User
      summary: Change the default currency of the account
      description: Stores the currency sent in the `X-Currency` header as the default currency of the calling account (the
        request body is ignored). The header only has to be non-blank - the value is not checked against the list of supported
        currencies, so send a code returned by the currencies dictionary.
      x-unverified: true
      parameters:
      - name: X-Currency
        in: header
        required: true
        description: ISO 4217 code of the new default currency.
        schema:
          type: string
          example: EUR
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '204':
          description: Currency saved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/user/customsDocument:
    get:
      operationId: customsDocumentGet
      tags:
      - Customs Documents
      summary: Download an attached customs document
      description: Returns the content of a file document (e.g. power of attorney, KRS extract) attached by the caller. The
        document is addressed by `name` (file documents) or by `value`; at least one of them is required. Documents of a value
        type (EORI) hold no file - asking for one answers 400 with a hint to read the value from `GET /v1/user/customsDocument/manifest`.
      parameters:
      - name: name
        in: query
        required: false
        description: File name of the document (as sent on upload). Required unless `value` is given.
        schema:
          type: string
          example: power-of-attorney.pdf
      - name: value
        in: query
        required: false
        description: Value of a value-type document (e.g. EORI number); used when `name` is not given.
        schema:
          type: string
          example: PL1234567890000
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The file, served inline with its detected content type.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Neither `name` nor `value` given (Error envelope), or the document is a value type (`message`).
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/CustomsDocumentMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The caller has no document with this name/value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomsDocumentMessage'
    post:
      operationId: customsDocumentUpload
      tags:
      - Customs Documents
      summary: Attach a customs clearance document
      description: 'Adds a document for customs clearance, of one of the types listed in `type` of the manifest. The accepted
        fields depend on the type: file types (`ATTORNEY`, `KRS`) take `name` + `content` (base64, max 5 MB) and optional
        `autoConnect`; value types (`EORI`) take `value` only. Fields that do not belong to the chosen type are rejected.
        Sending the same file (same `name` and `carrierName`) again overwrites it; a value type is kept once per account,
        so a second EORI replaces the first.'
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomsDocumentUploadRequest'
            examples:
              file:
                summary: File document
                value:
                  type: ATTORNEY
                  name: power-of-attorney.pdf
                  content: dGVzdA==
                  carrierName: DHL
                  autoConnect: true
              value:
                summary: Value document
                value:
                  type: EORI
                  value: PL1234567890000
      responses:
        '201':
          description: Document saved. Empty body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: customsDocumentDelete
      tags:
      - Customs Documents
      summary: Delete an attached customs document
      description: Removes a document of the caller, addressed by `name` (file documents) or `value` (value types such as
        EORI); at least one of them is required. The stored file is removed together with its manifest entry.
      parameters:
      - name: name
        in: query
        required: false
        description: File name of the document (as sent on upload). Required unless `value` is given.
        schema:
          type: string
          example: power-of-attorney.pdf
      - name: value
        in: query
        required: false
        description: Value of a value-type document (e.g. EORI number); used when `name` is not given.
        schema:
          type: string
          example: PL1234567890000
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '204':
          description: Document deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The caller has no document with this name/value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomsDocumentMessage'
  /v1/user/customsDocument/manifest:
    get:
      operationId: customsDocumentGetManifest
      tags:
      - Customs Documents
      summary: Get attached customs documents and available document types
      description: Returns the documents the caller has attached (`documentList`) and the dictionary of document types that
        can be attached (`type`), with names translated to `Accept-Language`. The `fields` of a type say which request fields
        `POST /v1/user/customsDocument` expects for it. The value of a value-type document (EORI) is read from `documentList[].value`.
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Manifest of the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomsDocumentManifest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/user/customsDocument/order:
    get:
      operationId: customsDocumentListForOrder
      tags:
      - Customs Documents
      summary: Get customs documents required for an order
      description: Returns the customs documents configured for the carrier integration of the given order, filtered by validity
        dates, EU/non-EU relation and sender/receiver country, grouped by user type and by customs value limit (`DOCUMENTS`,
        `UNDER_LIMIT`, `ABOVE_LIMIT`). Anonymous callers always receive an empty object.
      parameters:
      - name: number
        in: query
        required: true
        description: GK order number.
        schema:
          type: string
          example: GK000000000PL
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Documents grouped by user type, then by limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomsOrderDocuments'
              example:
                COMPANY:
                  DOCUMENTS:
                  - integration: '1'
                    title: certificate.pdf
                    name: certificate.pdf
                    carrierName: DHL
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - {}
      - tokenAuth: []
  /v1/user/default-agreements:
    put:
      operationId: userUpdateDefaultAgreements
      tags:
      - User
      summary: Set default agreements pre-applied to new orders
      description: Stores default values of order agreements that are pre-applied to every new order of the account. The keys
        of `defaultAgreements.order` are the codes of currently active order agreements (dynamic, managed in the admin panel);
        every key is optional, unknown keys are rejected.
      x-unverified: true
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserDefaultAgreementsRequest'
            example:
              defaultAgreements:
                order:
                  receiveCommercialInfo: false
                  receiveElectronicBills: true
                  processingPersonalData: true
      responses:
        '204':
          description: Defaults saved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/user/firstStepsWidget:
    put:
      operationId: userUpdateFirstStepsWidget
      tags:
      - User
      summary: Show or dismiss the first steps widget
      description: 'Stores whether Control Tower shows the first steps (onboarding) widget for the logged-in user.

        Sending `false` is what the bin icon on the widget does: the widget stays hidden on every browser and device,

        until `true` brings it back. The current value is returned as `isFirstStepsWidgetVisible` in `GET /v1/user/profile`.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserFirstStepsWidgetVisibility'
            example:
              isFirstStepsWidgetVisible: false
      responses:
        '204':
          description: Flag saved.
        '400':
          description: The flag is missing or is not a boolean.
          content:
            application/json:
              schema:
                type: object
                properties:
                  fields:
                    type: object
                    description: Field path -> validation message.
                    additionalProperties:
                      type: string
                example:
                  fields:
                    isFirstStepsWidgetVisible: This value should be of type bool.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/user/grantCoupon:
    post:
      operationId: userGrantCoupon
      tags:
      - User
      summary: Grant a coupon to an account created by the caller
      description: 'Business-partner feature: grants one of the caller''s coupons to an account the caller has registered
        (identified by e-mail) and notifies that account by e-mail. Available only to accounts with mass registration enabled
        - others receive 401. Fails if the target account is not one created by the caller or already holds the coupon.'
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserGrantCouponRequest'
            example:
              couponId: 123
              userEmail: jan.kowalski@example.com
      responses:
        '201':
          description: Coupon granted. Empty body.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/user/invoices:
    get:
      operationId: invoiceList
      tags:
      - Invoices
      summary: List invoices of the account
      description: Paginated list of the account's accounting documents, newest first. Pagination only works on whole pages,
        so `offset` must be divisible by `limit`. Not available to sub-users.
      parameters:
      - name: limit
        in: query
        required: false
        description: Page size, max 100.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: offset
        in: query
        required: false
        description: Index of the first result, divisible by `limit`.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: filters[orderNumber]
        in: query
        required: false
        description: Exact GK order number; returns invoices of that order.
        schema:
          type: string
          example: GK000000000PL
      - name: filters[invoiceNumber]
        in: query
        required: false
        description: Invoice number fragment, min. 3 characters.
        schema:
          type: string
          minLength: 3
      - name: filters[invoiceGroup]
        in: query
        required: false
        description: Document group. FVS - shipment invoices (FPRE, FVPR, FZOF, FZOD, FPRO numbering), FVSZ - additional services,
          FKS - corrective invoices.
        schema:
          type: string
          enum:
          - FVS
          - FVSZ
          - FKS
      - name: filters[paymentStatus]
        in: query
        required: false
        description: ALL (default), ONLY_NOT_PAID (not fully settled), ONLY_PAID (fully settled).
        schema:
          type: string
          enum:
          - ALL
          - ONLY_NOT_PAID
          - ONLY_PAID
          default: ALL
      - name: filters[amountFrom]
        in: query
        required: false
        description: Minimum gross amount, inclusive, max 2 decimal places.
        schema:
          type: number
          example: 12.99
      - name: filters[amountTo]
        in: query
        required: false
        description: Maximum gross amount, inclusive, max 2 decimal places; must be >= `amountFrom`.
        schema:
          type: number
          example: 99.99
      - name: filters[saleDayFrom]
        in: query
        required: false
        description: Sale date from, inclusive (YYYY-MM-DD).
        schema:
          type: string
          format: date
      - name: filters[saleDayTo]
        in: query
        required: false
        description: Sale date to, inclusive (YYYY-MM-DD); must be >= `saleDayFrom`.
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Page of invoices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceListPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/user/marketplace/allegro/capabilities:
    get:
      operationId: marketplaceGetAllegroCapabilities
      tags:
      - Marketplace Integrations
      summary: Check whether the account can dispatch through Allegro Delivery
      description: 'Tells whether the caller can send marketplace drafts on the Allegro rail (`POST /v1/user/order/drafts/marketplace`),
        with the reason when it cannot. The account is taken from the token. If the integration service does not answer in
        time the endpoint still returns 200 with `canDispatch: true` and `reason: UNKNOWN`.'
      x-unverified: true
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Capabilities of the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketplaceAllegroCapabilities'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/user/notificationEmails:
    get:
      operationId: userGetNotificationEmails
      tags:
      - User
      summary: Get addresses that receive invoices and labels
      description: Returns the alternative e-mail addresses invoices and labels are sent to. For a sub-user the parent account's
        addresses are returned, because those are the ones actually used.
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Notification addresses (null = not set).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserNotificationEmails'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: userUpdateNotificationEmails
      tags:
      - User
      summary: Change addresses that receive invoices and labels
      description: 'Partial update: only the fields sent are changed, at least one is required. `null` or an empty string
        clears the address. Not available to sub-users.'
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserNotificationEmails'
            example:
              invoicesToOtherEmail: jan.kowalski@example.com
      responses:
        '204':
          description: Addresses saved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/user/order/draft:
    put:
      operationId: orderDraftUpdate
      tags:
      - Order Drafts
      summary: Edit an order draft
      description: Edits the draft given by `id`. A field that is not sent stays unchanged; a field sent empty clears its
        value. The draft must belong to the caller.
      parameters:
      - name: id
        in: query
        required: true
        description: Draft id from `GET /v1/user/order/drafts`.
        schema:
          type: integer
          example: 123
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - orderDraft
              additionalProperties: false
              properties:
                orderDraft:
                  $ref: '#/components/schemas/OrderDraftInput'
      responses:
        '202':
          description: Draft updated; body links to the draft list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDraftAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: orderDraftDelete
      tags:
      - Order Drafts
      summary: Delete (hide) an order draft
      description: Marks one active draft of the caller as inactive. It is no longer listed by default; it can still be found
        with `filters[activeState]=0`.
      parameters:
      - name: id
        in: query
        required: true
        description: Id of an active draft of the caller.
        schema:
          type: integer
          example: 123
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '204':
          description: Draft deactivated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/user/order/draft/copy:
    post:
      operationId: orderDraftCopyFromOrder
      tags:
      - Order Drafts
      summary: Create a draft from an existing order
      description: Creates a new draft (origin `4` - copy) from an order of the caller. The collection type is `PICKUP` when
        the order had a pickup date, otherwise `POINT`.
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - number
              properties:
                number:
                  type: string
                  description: GK order number.
                  example: GK000000000PL
      responses:
        '201':
          description: Draft created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Id of the created draft.
                    example: 123
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/user/order/drafts:
    get:
      operationId: orderDraftList
      tags:
      - Order Drafts
      summary: List order drafts
      description: Paginated list of the caller's drafts. Each item has the draft data in `draft`; drafts from marketplaces
        also carry the imported sale in `metadata` (absent for CSV drafts). Items bought in one cart from the same auction
        are merged into one draft with several `metadata.items`. Empty fields are omitted, except `orderNumber`, `orderStatus`
        and `importFileId`, which are always present. Without `draftOrigin`, `id` or `importFileId` filters, CSV and copied
        drafts are not listed. When `draftsOrigin` is used, `receiver` and `auction` are ignored.
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: filters[draftOrigin]
        in: query
        required: false
        description: 1 Allegro, 2 eBay, 3 CSV, 4 copy, 5 Erli, 6 eMAG, 7 Etsy, 8 Sellasist.
        schema:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
          - 7
          - 8
      - name: filters[draftsOrigin]
        in: query
        required: false
        style: deepObject
        explode: true
        description: 'Several platforms at once, each with account label fragments, e.g. `filters[draftsOrigin][0][allegro][]=shop`.
          Platform keys: allegro, ebay, erli, emag, etsy.'
        schema:
          type: array
          items:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
                maxLength: 100
      - name: filters[id]
        in: query
        required: false
        description: Single draft id.
        schema:
          type: integer
      - name: filters[importFileId]
        in: query
        required: false
        description: Drafts of one CSV import (id from `GET /v1/user/order/drafts/import/files`).
        schema:
          type: integer
      - name: filters[tradePlatformAccount]
        in: query
        required: false
        description: Marketplace account label of the seller.
        schema:
          type: string
          maxLength: 1000
      - name: filters[receiver]
        in: query
        required: false
        description: Buyer/receiver name, address, phone or e-mail fragment.
        schema:
          type: string
          maxLength: 1000
      - name: filters[auction]
        in: query
        required: false
        description: Auction number or title, transaction or purchase number fragment.
        schema:
          type: string
          maxLength: 1000
      - name: filters[transportName]
        in: query
        required: false
        description: Marketplace delivery method name.
        schema:
          type: string
          maxLength: 100
      - name: filters[importDateSince]
        in: query
        required: false
        description: Draft created from.
        schema:
          type: string
          example: '2024-01-01'
      - name: filters[importDateTo]
        in: query
        required: false
        description: Draft created to.
        schema:
          type: string
          example: '2024-01-31'
      - name: filters[dealDateSince]
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: filters[dealDateTo]
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: filters[isCOD]
        in: query
        required: false
        description: 1 - drafts with addons (cash on delivery), 0 - drafts without addons.
        schema:
          type: integer
          enum:
          - 0
          - 1
      - name: filters[activeState]
        in: query
        required: false
        description: 0 - only inactive, 1 - only active.
        schema:
          type: integer
          enum:
          - 0
          - 1
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Page of drafts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDraftListPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: orderDraftCreateMany
      tags:
      - Order Drafts
      summary: Create order drafts
      description: Creates up to 100 drafts in one call. Each element of `orderDraft` has the fields of the edit method plus
        a required `draftOrigin`. Errors are reported per element index.
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - orderDraft
              properties:
                orderDraft:
                  type: array
                  maxItems: 100
                  items:
                    allOf:
                    - $ref: '#/components/schemas/OrderDraftInput'
                    - type: object
                      required:
                      - draftOrigin
      responses:
        '202':
          description: Drafts created; body links to the draft list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDraftAccepted'
        '400':
          description: Validation failed; `general` and/or errors keyed by the element index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDraftCollectionError'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: orderDraftDeactivateMany
      tags:
      - Order Drafts
      summary: Deactivate several order drafts
      description: Marks the given active drafts of the caller as inactive.
      parameters:
      - name: orderDraftsIds[]
        in: query
        required: true
        description: Ids of active drafts of the caller.
        schema:
          type: array
          items:
            type: integer
        example:
        - 1
        - 2
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '204':
          description: Drafts deactivated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/user/order/drafts/import:
    post:
      operationId: orderDraftImport
      tags:
      - Order Drafts
      summary: Import order drafts from a CSV file
      description: Creates drafts from a base64-encoded CSV file (max 5 MB, `;`-separated, header row as in `GET /v1/user/order/drafts/import/template`).
        The import is recorded as an import file that can be listed, sent as a whole and deleted. All rows are saved or none.
        Row errors are reported per row index.
      parameters:
      - name: fileType
        in: query
        required: true
        description: File format; only `csv` is supported.
        schema:
          type: string
          enum:
          - csv
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: byte
                  description: File content, MIME base64.
                fileName:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Name shown in the import file list; defaults to `import_<date>_<time>.csv`.
                  example: orders.csv
      responses:
        '202':
          description: Drafts imported.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/OrderDraftAccepted'
                - type: object
                  properties:
                    importFileId:
                      type: integer
                      example: 123
        '400':
          description: Invalid file type, file, headers or rows. File-level errors use the Error envelope; header and row
            errors are keyed by row index.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/OrderDraftCollectionError'
              example:
                '0':
                  '[shipment][integrationName]': Wrong integration name
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/user/order/drafts/import/file:
    delete:
      operationId: orderDraftDeleteImportFile
      tags:
      - Order Drafts
      summary: Delete a CSV import
      description: Deactivates the import file and archives all its drafts in one transaction.
      parameters:
      - name: id
        in: query
        required: true
        description: Id of an active import file of the caller.
        schema:
          type: integer
          example: 123
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '204':
          description: Import deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/user/order/drafts/import/files:
    get:
      operationId: orderDraftListImportFiles
      tags:
      - Order Drafts
      summary: List CSV imports
      description: Paginated list of the caller's active CSV imports, newest first.
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Page of import files.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDraftImportFileListPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/user/order/drafts/import/template:
    get:
      operationId: orderDraftGetImportTemplate
      tags:
      - Order Drafts
      summary: Download the CSV import template
      description: CSV file (UTF-8 with BOM, `;` separator) containing only the header row of the import format. Customs columns
        (`customs_*`) are not offered but still accepted by the import.
        The last two columns, `sender_short_name` and `receiver_short_name`, are optional (a file without them is still accepted).
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Template file (`order-drafts-import-template.csv`, attachment).
          content:
            application/csv:
              schema:
                type: string
              example: shipment_length;shipment_width;shipment_height;shipment_weight;...
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/user/order/drafts/import/template/instruction:
    get:
      operationId: orderDraftGetImportTemplateInstruction
      tags:
      - Order Drafts
      summary: Get the description of CSV import columns
      description: Column names of the import template with a translated description and whether they are required.
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Column list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDraftImportInstruction'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/user/order/drafts/marketplace:
    post:
      operationId: orderDraftSendMarketplace
      tags:
      - Order Drafts
      summary: Send marketplace drafts through Allegro Delivery
      description: 'Places orders for Allegro drafts on the Allegro Delivery product. Each draft is processed on its own:
        drafts already sent or not coming from Allegro are reported per draft and do not stop the others. `productTemplateId`
        is required unless exactly one draft is sent together with `shipment`; `shipment` is refused for more than one draft.
        Only collective payments (4 - deferred bank transfer, 9 - collective prepaid) are accepted. `idempotencyKey` (UUID)
        makes retries safe: the same key with the same body returns the stored answer, with a different body or while the
        first call is running it returns 409. Check `GET /v1/user/marketplace/allegro/capabilities` first.'
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderDraftMarketplaceSendRequest'
            example:
              orderDraftsIds:
              - 123
              paymentId: 4
              idempotencyKey: 3f2b6c1e-8a4d-4c2e-9b1a-0d5e7f9a1c23
              shipment:
                length: 20
                width: 15
                height: 10
                weight: 1.5
                content: Books
      responses:
        '200':
          description: All drafts sent. Body keyed by draft id, each value is the `POST /v1/order` response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDraftBatchResult'
        '207':
          description: Some drafts sent, some failed (same body shape).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDraftBatchResult'
        '400':
          description: Validation failed (Error envelope) or no draft was sent (batch result body).
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/OrderDraftBatchResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: The idempotency key was used with a different body or its first call is still running.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/user/order/drafts/order:
    post:
      operationId: orderDraftSendAsOrders
      tags:
      - Order Drafts
      summary: Send order drafts as orders
      description: Places an order for each selected draft (max 100) and sends a summary notification. Pass either `orderDraftsIds`
        or `importFileId` (all active drafts of a CSV import), never both. Drafts must be active, belong to the caller and
        not be ordered yet. With `customsDeclarationTemplateId` the saved customs declaration is applied to the drafts whose
        carrier and countries match it; the others are reported per draft, and if none match nothing is sent. Errors per draft
        carry `column`/`columnLabel` naming the CSV column.
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderDraftSendRequest'
            example:
              orderDraftsIds:
              - 123
              paymentId: 4
              productTemplateId: 1
      responses:
        '200':
          description: All drafts sent. Body keyed by draft id, each value is the `POST /v1/order` response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDraftBatchResult'
        '207':
          description: Some drafts sent, some failed (same body shape).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDraftBatchResult'
        '400':
          description: Validation failed (Error envelope) or no draft was sent (batch result body).
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Error'
                - $ref: '#/components/schemas/OrderDraftBatchResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/user/order/photo:
    get:
      operationId: orderPhotoGetR03
      tags:
      - Order Photo
      summary: Download an order photo
      description: 'Returns the binary image stored under `path` (as returned by the photo list; a `_miniature` path returns
        the thumbnail).

        The photo must belong to an order of the caller''s account (the parent account for sub-accounts).

        '
      x-proxied-to: /public/v2/user/order/photo
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: path
        in: query
        required: true
        description: Photo path from the photo list.
        schema:
          type: string
          example: /GK000000000PL/0123456789abcdef0123456789abcdef.jpeg
      responses:
        '200':
          description: Image; `Content-Type` is the detected MIME type.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/heic:
              schema:
                type: string
                format: binary
        '400':
          description: '`fields.path` blank or not an existing photo of the account.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProxyErrorV2'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: orderPhotoUploadR03
      tags:
      - Order Photo
      summary: Upload or replace an order photo
      description: 'Attaches a photo (base64 in JSON) to an order of the caller''s account. Uploading a photo with the same
        `name` for the same order

        replaces the previous one. Limits come from `GET /v1/user/order/photo/configuration` (dimensions, ratio) and at most
        4 active

        photos per order (a replacement does not count). Accepted image types: JPEG, HEIF, HEIC. A thumbnail is generated
        automatically.

        '
      x-proxied-to: /public/v2/user/order/photo
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderPhotoUploadRequestV2'
      responses:
        '204':
          description: Photo stored.
        '400':
          description: Validation error (`fields.file`, `fields.name`, `fields.orderNumber`) or `general` (e.g. extra fields).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProxyErrorV2'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Storage or database failure while saving (empty body).
    delete:
      operationId: orderPhotoDeleteR03
      tags:
      - Order Photo
      summary: Delete an order photo
      description: Deletes a photo of an order of the caller's account, identified by its path.
      x-proxied-to: /public/v2/user/order/photo
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: path
        in: query
        required: true
        description: Photo path from the photo list.
        schema:
          type: string
          example: /GK000000000PL/0123456789abcdef0123456789abcdef.jpeg
      responses:
        '204':
          description: Photo deleted.
        '400':
