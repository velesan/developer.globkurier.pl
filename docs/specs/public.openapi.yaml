  /v1/user/stats:
    get:
      operationId: userGetStats
      tags:
      - User
      summary: Get account and payment statistics
      description: 'Account counters for the main account: prepaid balance, receivables, parcels this month, estimated savings,

        overdue COD, overpayment and credit limit/used/available. No currency conversion: `values` lists every

        currency the account holds, with the `X-Currency` currency (default PLN) always first, also when zero.

        The scalar `value`/`currency` (prepaidBalance, packageCountInCurrentMonth, savedPayments, credit*) is the counter

        in the `X-Currency` currency - use it to check what can pay for an order priced in that currency. Credit amounts

        are converted to the `X-Currency` currency. `filter[]` limits the counters returned (unknown names ignored,

        none = all); a sub-account always gets the set allowed by its parent account and the filter is ignored.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/XCurrency'
      - name: filter[]
        in: query
        required: false
        description: Counters to return.
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            enum:
            - prepaidBalance
            - receivablePayment
            - packageCountInCurrentMonth
            - savedPayments
            - overdueCashOnDelivery
            - excessPayment
            - creditLimit
            - creditUsed
            - creditAvailable
      responses:
        '200':
          description: Requested statistics, keyed by counter name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/user/stats/sync:
    get:
      operationId: userSyncStats
      tags:
      - User
      summary: Request credit limit refresh
      description: 'Queues an asynchronous refresh of the main account''s credit limit from the accounting system and returns
        at once.

        Read the refreshed values later from the URL in `location` (`GET /v1/user/stats`).

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '202':
          description: Refresh queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatsSyncAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/user/subUser:
    get:
      operationId: subUserGet
      tags:
      - Sub Account
      summary: Get sub-account
      description: Returns one active sub-account of the logged-in main account.
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: id
        in: query
        required: true
        description: Sub-account identifier.
        schema:
          type: integer
          example: 123
      responses:
        '200':
          description: Sub-account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: subUserCreate
      tags:
      - Sub Account
      summary: Create sub-account
      description: 'Creates a sub-account under the logged-in main account. The e-mail must be unused; the password needs
        at least

        6 characters with a lowercase letter, an uppercase letter and a digit. `cashOnDelivery` (default COD payout

        details) is optional; when sent, `swiftCode` is required unless the main account is Polish.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubUserCreateRequest'
            example:
              name: Jan
              surname: Kowalski
              email: jan.kowalski@example.com
              phone: '+48500000000'
              password: Passw0rd
              cashOnDelivery:
                bankAccountNumber: PL00000000000000000000000000
                name: Jan Kowalski
                addressLine1: Example Street 1
                addressLine2: 00-000 Warszawa
      responses:
        '201':
          description: Sub-account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubUserCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: subUserUpdate
      tags:
      - Sub Account
      summary: Update sub-account
      description: 'Updates data of a sub-account owned by the logged-in main account. The password cannot be changed here

        (sending `password` fails validation). A changed e-mail must be unused.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubUserUpdateRequest'
            example:
              id: 123
              name: Jan
              surname: Kowalski
              email: jan.kowalski@example.com
              phone: '+48500000000'
      responses:
        '204':
          description: Sub-account updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: subUserDelete
      tags:
      - Sub Account
      summary: Delete sub-account
      description: 'Deactivates and archives a sub-account owned by the logged-in main account; its e-mail is released

        (rewritten to an archived form) so it can be registered again. Order history is kept.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: id
        in: query
        required: true
        description: Sub-account identifier.
        schema:
          type: integer
          example: 123
      responses:
        '204':
          description: Sub-account deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/user/subUsers:
    get:
      operationId: subUserList
      tags:
      - Sub Account
      summary: List sub-accounts
      description: All active (not archived) sub-accounts of the logged-in main account.
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Sub-accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/user/verificationCode:
    post:
      operationId: userSendVerificationCode
      tags:
      - User
      summary: Send SMS verification code
      description: 'Sends an SMS with a phone verification code (used e.g. during registration). The number must be a mobile
        number

        in a country supported for SMS verification. Anonymous callers must also send a valid reCAPTCHA token (checked

        last, so a mistyped number does not burn it); callers with a token skip the captcha.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserVerificationCodeRequest'
            example:
              phone: '+48500000000'
              gRecaptchaResponse: recaptcha-token
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserVerificationCodeRequest'
      responses:
        '202':
          description: SMS sent (empty body).
        '400':
          $ref: '#/components/responses/BadRequest'
      security:
      - {}
      - tokenAuth: []
  /v1/zoho/cases:
    get:
      operationId: zohoListCasesR01
      tags:
      - Customer Cases
      summary: List customer cases (submissions or complaints) from Zoho
      description: 'Returns the caller''s cases from Zoho, newest change first. With a token the cases of the logged-in user
        are

        returned; without a token both `id` and `email` are required (lookup of one case, e.g. from an e-mail link).

        For a complaint module (`Reklamacje_PSC`, `Reklamacje_Faktur`) all complaint modules are queried and merged,

        and each row additionally gets `statusGroup`, `slaBreached`, `slaOverdueDays`, `carrierDeadline`,

        `escalationCount`, `escalationsRemaining`, `canAppeal`, `handedToCarrierAt`, `daysToCarrierDeadline`, `carrier`, `carrierLogo`,

        `claimAmount`, `acceptedAmount`, `carrierDecision`, `missingDocuments`, `missingDocumentsNote`; `statusGroup` and `slaBreached` filters apply to complaint modules

        only. For other modules (e.g. `Cases`) Zoho Desk submissions are merged in. `Attachments` combines the CRM

        attachments and documents attached in the complaint form. `offset` must be a multiple of `limit`.

        No matching case returns `404` with an empty body.

        '
      x-proxied-to: /public/v2/zoho/cases
      parameters:
      - name: module
        in: query
        required: true
        description: Zoho CRM module name.
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_]{1,256}$
        example: Reklamacje_PSC
      - name: month
        in: query
        required: false
        description: Month filter `YYYY-mm`.
        schema:
          type: string
          pattern: ^\d{4}-\d{2}$
        example: 2026-08
      - name: statusGroup
        in: query
        required: false
        description: Complaint modules only - comma separated status groups.
        schema:
          type: string
        example: AT_CARRIER,APPEAL
      - name: slaBreached
        in: query
        required: false
        description: Complaint modules only - `1`/`true` only past the carrier deadline, `0`/`false` only not past it.
        schema:
          type: string
          enum:
          - '0'
          - '1'
          - 'true'
          - 'false'
      - name: filters
        in: query
        required: false
        description: 'Up to 7 filters `filters[i][name]`, `filters[i][value]`, optional `filters[i][searchType]` (`equals`,

          `starts_with`). Allowed names: id, Status_PK, Numer_GK, Numer_zlecenia, Type, Widoczne_w_PK,

          Reklamacja_widoczna, Numer_wen_reklamacji, Nowy_numer_wew_Reklamacji, Stary_numer_wew_Reklamacji,

          Data_utworzenia, Pow_d_reklamacji_WWW, Pow_d_reklamacji_www, Nr_Faktury, Numer_faktury.

          Values must not contain `(`, `)` or `:`.

          '
        style: deepObject
        explode: true
        schema:
          type: object
          maxProperties: 7
          additionalProperties:
            $ref: '#/components/schemas/ZohoCaseFilterV2'
      - name: offset
        in: query
        required: false
        description: Number of records to skip; must be a multiple of `limit`.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 25
      - name: id
        in: query
        required: false
        description: Zoho record/ticket id. Required (with `email`) when no token is sent; also narrows the result to this
          case and loads Desk attachments.
        schema:
          type: string
        example: '123'
      - name: email
        in: query
        required: false
        description: Case e-mail. Required (with `id`) when no token is sent.
        schema:
          type: string
          format: email
        example: jan.kowalski@example.com
      responses:
        '200':
          description: Page of cases.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZohoCasePageV2'
        '400':
          description: Validation error (module, month, filters, pagination, statusGroup, slaBreached, id/email for anonymous
            calls).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
              example:
                fields:
                  statusGroup: Unknown status group.
        '404':
          description: No case matches (empty body).
      security:
      - {}
      - tokenAuth: []
    post:
      operationId: zohoUploadCaseAttachmentR01
      tags:
      - Customer Cases
      summary: Attach a base64 file to a complaint and update its CRM fields (panel contract)
      description: 'Legacy panel contract: JSON with a base64 file. Login is required - without a token the v2 service answers
        `401`

        (after body validation) although the gk ACL lets the call through. The complaint (`leadId`) must belong to the

        user and be open. Only `Status_reklamacji` and `INFORMACJE_DO_ODWO_ANIA` from `data` are written to Zoho, other

        keys are dropped. File limits are those of the complaint documents (max 15 files / 100 MB per complaint); the

        decoded file may not exceed 1 MB here. New integrations should use `POST /v1/complaints/{complaintNumber}/documents`.

        '
      x-proxied-to: /public/v2/zoho/cases
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ZohoCaseAttachmentUploadRequestV2'
            example:
              module: Reklamacje_PSC
              leadId: '123'
              data:
                Status_reklamacji: Odwolanie
                INFORMACJE_DO_ODWO_ANIA: Additional information.
              file:
                name: protocol.pdf
                content: JVBERi0xLjQK
      responses:
        '200':
          description: Attachment stored and record updated (empty body).
        '400':
          description: Validation error (module not a complaint module, blank leadId/data, file name/content).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
        '401':
          description: No token / not logged in (empty body).
        '404':
          description: Complaint does not exist or does not belong to the user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
              example:
                error: Complaint not found.
        '409':
          description: Per-complaint file or size limit reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
              example:
                error: Attachment limit reached.
        '422':
          description: Complaint is closed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
              example:
                error: Complaint is closed.
        '503':
          description: Document storage or Zoho lookup unavailable, or `file.content` is not valid base64.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
              example:
                error: Temporarily unavailable.
      security:
      - {}
      - tokenAuth: []
  /v1/zoho/cases/getAttachment:
    get:
      operationId: zohoGetCaseAttachmentR01
      tags:
      - Customer Cases
      summary: Download a case attachment
      description: 'Streams an attachment listed in `Attachments` of `GET /v1/zoho/cases`. A numeric `attachmentId` is a CRM

        attachment of record `leadId` (for complaint modules the module is resolved from the record, whatever was sent);

        a non-numeric one is a WorkDrive file id from the complaint form and is downloaded directly.

        No ownership check is made and no token is required. gk passes only `Content-Type` through.

        '
      x-proxied-to: /public/v2/zoho/cases/getAttachment
      parameters:
      - name: module
        in: query
        required: true
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_]{1,256}
        example: Reklamacje_PSC
      - name: name
        in: query
        required: true
        description: Attachment file name (required, not used to locate the file).
        schema:
          type: string
        example: protocol.pdf
      - name: leadId
        in: query
        required: true
        description: Zoho record id.
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_]{1,256}
        example: '123'
      - name: attachmentId
        in: query
        required: true
        description: CRM attachment id (digits) or WorkDrive file id.
        schema:
          type: string
          pattern: ^[a-zA-Z0-9_]{1,256}
        example: '456'
      responses:
        '200':
          description: Attachment content with the type reported by Zoho.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: A parameter is blank or has an invalid format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
              example:
                fields:
                  module: This value should not be blank.
        '404':
          description: Attachment not found or empty (empty body).
      security:
      - {}
      - tokenAuth: []
components:
  securitySchemes:
    tokenAuth:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: Token returned by `POST /v1/auth/login`.
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Language of translated messages and dictionaries.
      schema:
        type: string
        enum:
        - pl
        - en
        - br
        - cn
        - cz
        - de
        - es
        - fr
        - pt
        - ru
        example: pl
    XCurrency:
      name: X-Currency
      in: header
      required: false
      description: Currency in which prices are returned; must be a supported currency code.
      schema:
        type: string
        example: PLN
  schemas:
    AdrItem:
      type: object
      description: 'One item of dangerous goods in `fields.items` of the ADR addon (GLOBKURIER-10206) - one line of the ADR
        transport document: one UN entry in packages of one type. The same UN number in different packagings (e.g. drums and
        boxes) is two items. Unknown fields are rejected. Errors (message of the code): `ADR_ITEM_INVALID` "Invalid ADR item.", `ADR_UN_INVALID` "A UN number has
        4 digits, e.g. 1203.", `ADR_ENTRY_INVALID` "The ADR table entry is a number from 1, e.g. 1.", `ADR_MODE_INVALID`
        "Mode must be FULL, LQ or EQ.", `ADR_QUANTITY_INVALID` "Quantity must be a number greater than 0.", `ADR_UNIT_INVALID`
        "Unit must be L, KG or KG_GROSS.", `ADR_PACKAGES_COUNT_INVALID` "Number of packages must be a whole number from 1
        to 9999.", `ADR_PACKAGE_TYPE_INVALID` "Packaging code up to 10 characters, e.g. 4G or 1A1.", `ADR_TECHNICAL_NAME_INVALID`
        "The technical name can have up to 100 characters.", `ADR_FLAG_INVALID` "The value must be true or false.", `ADR_UN_UNKNOWN`
        "UN<un> is not in the current ADR list.", `ADR_ENTRY_REQUIRED` "UN<un> has <count> entries in the ADR table - choose
        one (entry).", `ADR_ENTRY_UNKNOWN` "UN<un> has no entry <entry> in the ADR table.", `ADR_UN_PROHIBITED` "Carriage
        of UN<un> is forbidden under ADR.", `ADR_UN_NOT_SUBJECT` "UN<un> is not subject to ADR - do not add the ADR addon
        for it.", `ADR_CLASS_NOT_ACCEPTED` "This service does not take dangerous goods of class <class>." (no surcharge price
        for the class in the order currency), `ADR_UN_EXCLUDED` "This service does not take UN<un>." (carrier policy for
        the product and direction), `ADR_LQ_NOT_ALLOWED` / `ADR_EQ_NOT_ALLOWED` "UN<un> cannot be carried as a limited /
        excepted quantity (LQ/EQ).", `ADR_TECHNICAL_NAME_REQUIRED` "UN<un> needs the technical name of the substance.";
        on the list: `ADR_ITEMS_REQUIRED` "Add at least one ADR item.", `ADR_ITEMS_TOO_MANY` "At most 20 ADR items per
        order."; on the order: `ADR_SURCHARGE_NOT_PRICED` "This service has no ADR surcharge price in <currency> for the
        given ADR items." Messages are translated (`Accept-Language`).'
      required:
      - un
      - mode
      - quantity
      - unit
      - packagesCount
      additionalProperties: false
      properties:
        un:
          description: UN number, 4 digits; `UN` prefix and lost leading zeros (`20` = `0020`) accepted.
          oneOf:
          - type: string
          - type: integer
          example: '1203'
        entry:
          type: integer
          minimum: 1
          maximum: 99
          description: Entry of the UN number in ADR table A (`entry` of `GET /v1/adr/dangerous-goods`); required when the
            UN number has several entries.
        mode:
          type: string
          enum:
          - FULL
          - LQ
          - EQ
          description: Full ADR, limited quantity (LQ, only where column 7a allows it) or excepted quantity (EQ, column 7b).
        quantity:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 100000
          description: 'TOTAL quantity of the dangerous goods of this item, from all its packages together, in `unit` -
            not the quantity of one package. E.g. 4 boxes with 6 tins of 0.5 L paint each: `quantity` 12, `unit` L,
            `packagesCount` 4.'
          example: 12
        unit:
          type: string
          enum:
          - L
          - KG
          - KG_GROSS
          description: 'Unit of `quantity`: `L` - litres (liquids), `KG` - net mass, the dangerous goods alone (solids),
            `KG_GROSS` - gross mass, the goods with their packaging (usual for limited quantities, `mode` LQ).'
          example: L
        packagesCount:
          type: integer
          minimum: 1
          maximum: 9999
          description: 'Number of PACKAGES (outer packagings: boxes, drums, canisters) holding this item - not the number of
            pieces inside a package. The 4 boxes of the example: 4.'
          example: 4
        packageType:
          type: string
          pattern: ^[A-Za-z0-9/ ]{1,10}$
          description: UN packaging code of those packages, e.g. 4G (fibreboard box) or 1A1 (steel drum).
          example: 4G
        technicalName:
          type: string
          maxLength: 100
          description: Technical name of the substance; required where special provision 274 or 318 asks for it.
        environmentallyHazardous:
          type: boolean
        waste:
          type: boolean
    DangerousGoodsTile:
      type: object
      description: One tile of the dangerous goods dialog (GLOBKURIER-10211), in the request's language.
      required:
      - id
      - severity
      - title
      - description
      - icon
      - adrClasses
      - requiresAdrAddon
      properties:
        id:
          type: integer
          example: 1
        severity:
          type: string
          enum:
          - RED
          - YELLOW
          description: '`RED` - not carried, `YELLOW` - only with restrictions (selected services or the ADR addon).'
        title:
          type: string
          nullable: true
          example: Explosives
        description:
          type: string
          nullable: true
          description: Examples of the goods.
          example: Fireworks, firecrackers, ammunition.
        icon:
          type: string
          nullable: true
          description: Font Awesome icon class.
          example: fa-burst
        adrClasses:
          type: array
          description: ADR / IATA DGR classes (codes of the class dictionary) the tile is about, set in the panel - usually
            one. Pass them as `class` to `GET /v1/adr/dangerous-goods` to list the UN numbers of the tile.
          items:
            type: string
          example:
          - '3'
        requiresAdrAddon:
          type: boolean
          description: The goods go only by pallet with the ADR addon (set in the panel). The front shows the note itself,
            e.g. "Only by pallet with the ADR addon" - the description does not contain it.
          example: true
    AdrDangerousGoodsEntry:
      type: object
      description: One entry of ADR table A (UN number + entry), current edition.
      required:
      - un
      - entry
      - name
      - class
      - status
      - limitedQuantityAllowed
      - exceptedQuantityAllowed
      - requiresTechnicalName
      - severity
      - edition
      properties:
        un:
          type: string
          description: UN number, four digits.
          example: '1263'
        entry:
          type: integer
          description: Position of the entry among the entries of this UN number (1 when there is only one).
        name:
          type: object
          description: Proper shipping name from ADR table A.
          properties:
            pl:
              type: string
              nullable: true
            en:
              type: string
              nullable: true
        customName:
          type: object
          nullable: true
          description: GlobKurier's own name by language (pl/en/de), e.g. "Powerbank" for UN3480; null when not set.
          additionalProperties:
            type: string
            nullable: true
        class:
          type: string
          description: ADR class or division, e.g. 3, 2.1, 6.2.
        severity:
          type: string
          enum:
          - RED
          - YELLOW
          description: How the form marks the entry - `YELLOW` for class 9 (miscellaneous dangerous goods), `RED` for every
            other class.
        subsidiaryRisks:
          type: string
          nullable: true
          description: Comma separated subsidiary risks, e.g. 6.1,8.
        classificationCode:
          type: string
          nullable: true
          description: ADR classification code, column (3b).
        packingGroup:
          type: string
          nullable: true
          enum:
          - I
          - II
          - III
          - null
        labels:
          type: string
          nullable: true
          description: Danger labels, column (5).
        tunnelCode:
          type: string
          nullable: true
          description: Tunnel restriction code, e.g. (D/E).
        status:
          type: string
          enum:
          - REGULATED
          - PROHIBITED
          - NOT_SUBJECT
          description: REGULATED - carried under ADR; PROHIBITED - carriage forbidden; NOT_SUBJECT - not subject to ADR.
        limitedQuantity:
          type: string
          nullable: true
          description: Limited quantity per inner packaging, column (7a); "0" = not allowed.
        exceptedQuantity:
          type: string
          nullable: true
          description: Excepted quantity code, column (7b), E0 to E5.
        limitedQuantityAllowed:
          type: boolean
          description: Whether the entry may go as a limited quantity (LQ).
        exceptedQuantityAllowed:
          type: boolean
          description: Whether the entry may go as an excepted quantity (EQ).
        requiresTechnicalName:
          type: boolean
          description: Whether the technical name must be given next to the proper shipping name (special provision 274 or 318).
        edition:
          type: string
          description: ADR edition the entry comes from, e.g. 2025.
        allowedForProduct:
          type: boolean
          description: Only with `productId` - whether the product takes the entry.
        notAllowedReason:
          type: string
          nullable: true
          enum:
          - PROHIBITED
          - NOT_SUBJECT
          - CLASS_NOT_ACCEPTED
          - UN_EXCLUDED
          - null
          description: Only with `productId` - why the product does not take the entry; null when it does.
