  /v1/user/partnerProgram:
    get:
      operationId: partnerProgramGetSummary
      tags:
      - Partner Program
      summary: Get partner program summary
      description: 'Commissions configured for the user in the partner (referral) program and a summary of program activity:

        registered partners, their orders and the commission earned on them, both all-time and per month for the

        last 12 months. Every month of that window is present, also with zero activity (keys `YYYY-MM`, newest first).

        Cancelled orders are not counted. `cashback` is the commission earned but not yet paid out.

        Available to main accounts only (not to sub-accounts). Response is cacheable for 60 s.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Partner program summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerProgramSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/user/partnerProgram/orders:
    get:
      operationId: partnerProgramGetOrders
      tags:
      - Partner Program
      summary: List partner orders with commission
      description: 'Paginated list of partners'' orders for which a commission was charged to the user, plus the total commission

        for the applied filters. Cancelled orders are excluded. All filters are optional and can be combined; dates

        accept a day (`YYYY-MM-DD`) or a month (`YYYY-MM`), both bounds inclusive, `dateTo` must be >= `dateFrom`.

        Available to main accounts only. Response is cacheable for 30 s.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: limit
        in: query
        required: false
        description: Page size, default 100, maximum 1000.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - name: offset
        in: query
        required: false
        description: Zero-based position of the first result, default 0.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: filters[partnerId]
        in: query
        required: false
        description: Partner account identifier (`partnerId` from the lists, not the partner's program number).
        schema:
          type: integer
          example: 123
      - name: filters[dateFrom]
        in: query
        required: false
        description: Start of period, inclusive - `YYYY-MM-DD` or `YYYY-MM`.
        schema:
          type: string
          pattern: ^\d{4}-\d{2}(-\d{2})?$
          example: 2025-01
      - name: filters[dateTo]
        in: query
        required: false
        description: End of period, inclusive - `YYYY-MM-DD` or `YYYY-MM`; use the same format as `dateFrom` and a value >=
          it.
        schema:
          type: string
          pattern: ^\d{4}-\d{2}(-\d{2})?$
          example: 2025-12
      responses:
        '200':
          description: Page of partner orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerProgramOrderPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/user/partnerProgram/partners:
    get:
      operationId: partnerProgramGetPartners
      tags:
      - Partner Program
      summary: List registered partners
      description: 'Paginated list of accounts registered from the user''s referral link or banner. City and post code stay
        `null`

        until the partner completes the address (incomplete registration). Filters as in

        `GET /v1/user/partnerProgram/orders`; dates filter by registration date. Available to main accounts only.

        Response is cacheable for 30 s.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: limit
        in: query
        required: false
        description: Page size, default 100, maximum 1000.
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      - name: offset
        in: query
        required: false
        description: Zero-based position of the first result, default 0.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: filters[partnerId]
        in: query
        required: false
        description: Partner account identifier (`partnerId` from the lists, not the partner's program number).
        schema:
          type: integer
          example: 123
      - name: filters[dateFrom]
        in: query
        required: false
        description: Start of period, inclusive - `YYYY-MM-DD` or `YYYY-MM`.
        schema:
          type: string
          pattern: ^\d{4}-\d{2}(-\d{2})?$
          example: 2025-01
      - name: filters[dateTo]
        in: query
        required: false
        description: End of period, inclusive - `YYYY-MM-DD` or `YYYY-MM`; use the same format as `dateFrom` and a value >=
          it.
        schema:
          type: string
          pattern: ^\d{4}-\d{2}(-\d{2})?$
          example: 2025-12
      responses:
        '200':
          description: Page of registered partners.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerProgramPartnerPage'
        '400':
