      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: year
        in: query
        required: false
        description: Report year; missing or `0` means the current year.
        schema:
          type: integer
        example: 2026
      responses:
        '200':
          description: Volume report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportUserVolumeV2'
        '400':
          description: '`year` is not an integer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderProxyErrorV2'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/states:
