      - successReturnLink
      - failedReturnLink
      properties:
        token:
          type: string
          description: GlobKurier token of the account the platform account should be linked to. Omit to log in / register
            with the platform account.
        successReturnLink:
          type: string
          format: uri
          description: Where to redirect after success.
          example: https://example.com/login/success
        failedReturnLink:
          type: string
          format: uri
          description: Where to redirect after failure.
          example: https://example.com/login/failed
    NotificationInboxItem:
      type: object
      properties:
        id:
          type: integer
          example: 1842
        eventType:
          type: string
          description: Code from the event dictionary.
          example: invoice.overdue
        category:
          type: string
          enum:
          - complaint
          - invoice
          - shipment
          - system
        titleKey:
          type: string
          description: Translation key of the title on the front end.
          example: NOTIFICATIONS.INBOX.INVOICE_OVERDUE
        params:
          type: object
          additionalProperties: true
          description: 'Translation parameters, always an object. A system message carries `title` and `body`, each
            keyed by language (pl, en, de). A complaint status change (`complaint.status_changed`) carries
            `complaintNumber` (nullable), `orderNumber` (the first GK order number of the complaint, nullable) and
            `statusGroup` — the group the customer is shown on the complaint page: `VERIFICATION`,
            `MISSING_DOCUMENTS`, `AT_CARRIER`, `APPEAL`, `ACCEPTED`, `REJECTED`, `CLOSED` or `INTERVENTION`.'
          example:
            invoiceNumber: FV/2026/10/123
        target:
          type: object
          nullable: true
          properties:
            type:
              type: string
              enum:
              - order
              - invoice
              - complaint
            ref:
              type: string
              description: Order, invoice or complaint number.
              example: FV/2026/10/123
        link:
          type: string
          nullable: true
          maxLength: 255
          pattern: ^/(?!/)[\x21-\x7e]*$
          description: Path of Control Tower that a click on a notification without a `target` opens (a system message
            may carry one), e.g. `/settings?tab=notifications`. Always printable ASCII starting with a single slash, never a
            URL, with no backslash; the front end ignores anything else. `null` when the notification is not a link.
          example: /settings?tab=notifications
        createdAt:
          type: string
          format: date-time
          description: When the notification appeared in the bell — the day of a scheduled message, the latest
            occurrence of one that came back (e.g. a shipment stuck in customs again).
        read:
          type: boolean
        resolved:
          type: boolean
          description: The matter is over (e.g. invoice paid); not counted as unread.
    NotificationInboxList:
      type: object
      properties:
        enabled:
          type: boolean
          description: False when the bell is switched off for the account; hide the bell.
        unreadCount:
          type: integer
          maximum: 100
        items:
          type: array
          items:
            $ref: '#/components/schemas/NotificationInboxItem'
    NotificationInboxSettings:
      type: object
      properties:
        enabled:
          type: boolean
          description: False outside the pilot of the bell (no categories then).
        editable:
          type: boolean
          description: False for a sub-account — only the main account changes the company-wide settings.
        categories:
          type: array
          items:
            type: object
            properties:
              category:
                type: string
                enum:
                - complaint
                - invoice
                - shipment
              eventTypes:
                type: array
                items:
                  type: object
                  properties:
                    eventType:
                      type: string
                      example: invoice.overdue
                    titleKey:
                      type: string
                      example: NOTIFICATIONS.INBOX.INVOICE_OVERDUE
                    enabled:
                      type: boolean
                    editable:
                      type: boolean
                      description: Whether this person may switch it — always for a complaint type, for the rest only
                        the main account.
