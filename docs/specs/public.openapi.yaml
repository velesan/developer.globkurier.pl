            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - {}
      - tokenAuth: []
    delete:
      operationId: integrationAllegroDeleteAccount
      tags:
