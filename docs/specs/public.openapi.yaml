          type: string
          nullable: true
        Case_Number:
          type: string
          nullable: true
        Numer_zlecenia:
          type: string
          nullable: true
        Numer_wen_reklamacji:
          type: string
          nullable: true
          description: Internal complaint number.
        Pow_d_reklamacji_WWW:
          type: string
          nullable: true
          description: Complaint reason chosen on the website.
        Opis:
          type: string
          nullable: true
        Data_utworzenia:
          type: string
          nullable: true
          description: Submission date (business date or creation timestamp).
        statusGroup:
          type: string
          enum:
          - VERIFICATION
          - MISSING_DOCUMENTS
          - AT_CARRIER
          - APPEAL
          - ACCEPTED
          - REJECTED
          - CLOSED
          - INTERVENTION
          - UNKNOWN
        slaBreached:
          type: boolean
          nullable: true
        slaOverdueDays:
          type: integer
          nullable: true
        carrierDeadline:
          type: string
          format: date-time
          nullable: true
        escalationCount:
          type: integer
          nullable: true
        escalationsRemaining:
          type: integer
          nullable: true
        canAppeal:
          type: boolean
          nullable: true
          description: true only for a decided complaint (ACCEPTED or REJECTED); an appeal otherwise answers 422.
        handedToCarrierAt:
          type: string
          format: date-time
          nullable: true
          description: When the complaint was handed to the carrier.
        daysToCarrierDeadline:
          type: integer
          nullable: true
          description: Whole calendar days the carrier has left; 0 = due within 24 hours; null when no deadline is running.
        carrier:
          type: string
          nullable: true
          description: Carrier as stored by GlobKurier (PSC multiselect joined with ", "), same names as in the statistics.
        carrierLogo:
          type: string
          nullable: true
          description: Carrier brand logo in the same form as `logo` in `GET /v1/carriers`. For a brand still offered it is
            the same file the unfiltered carrier list shows; a brand no longer offered falls back to its first carrier.
            Matched to `carrier` ignoring case, spaces and punctuation (first carrier of a multiselect). null when no
            carrier is set or no brand matches.
          example: v2/brand/carrier/12.png
        claimAmount:
          type: number
          nullable: true
          description: Claimed amount (`Roszczenie`).
        acceptedAmount:
          type: number
          nullable: true
          description: Accepted amount (PSC `Kwota_uznanej_reklamacji`, invoice complaints `Uznano`).
        carrierDecision:
          type: string
          nullable: true
          description: Carrier's decision text (invoice complaints only).
        missingDocuments:
          type: array
          items:
            type: string
          description: Documents still missing (PSC only); empty when none.
        missingDocumentsNote:
          type: string
          nullable: true
          description: Free-text note about the missing documents (PSC only).
    ZohoCasePageV2:
