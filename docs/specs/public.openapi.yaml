          pattern: ^[\p{L}\p{N}][\p{L}\p{N} '_\-]*$
          description: Document type from the manifest `typeList` (carrier type names may contain spaces and an apostrophe,
            e.g. `Shipper's Letter of Instruction`); letters, digits, space, `'`, `_`, `-`, starting with a letter or digit.
          example: COMMERCIAL_INVOICE
