          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - {}
      - tokenAuth: []
  /v1/integrations/tradePlatform/allegro/account/credentials:
    get:
      operationId: integrationAllegroCollectCredentials
      tags:
      - Integrations
      summary: Collect Allegro OAuth credentials
      description: 'One-time pickup of the tokens obtained in the Allegro OAuth callback. The panel receives `state` in its
        return URL (`allegro_oauth_ready=1&state=...`) and exchanges it here; the stored credentials are deleted on read and
        expire if not collected. Only the logged-in account that started the procedure gets them - someone else''s `state`
        is answered like an unknown one. Response carries `Cache-Control: no-store`. Pass the returned `credentials` to `POST
        .../allegro/account`.'
      parameters:
      - name: state
        in: query
        required: true
        description: OAuth `state` returned to the panel after the Allegro callback.
        schema:
          type: string
          example: 3f2b1c0e9a8d7f6e
      responses:
        '200':
          description: Credentials ready to be saved with the integration.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationAllegroCredentialsResponse'
        '400':
          description: '`missing_state_parameter`, `credentials_not_found_or_expired` (unknown, expired, already collected
            or someone else''s state) or `invalid_credentials_format`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
      security:
      - {}
      - tokenAuth: []
  /v1/integrations/tradePlatform/allegro/account/verify:
    get:
      operationId: integrationAllegroOAuthCallback
      tags:
      - Integrations
      summary: Allegro OAuth callback
      description: Redirect URI registered in the Allegro application - called by the customer's browser, not by API clients.
        Accepts only a `state` issued by `POST /v1/oauth/allegro`, exchanges `code` for tokens via hermes-2, stores them briefly
        server-side and redirects to the success return link (cookie `allegroSuccessReturnLink`, default panel page) with
        `allegro_oauth_ready=1&state=...`. Tokens never travel in the URL. Any failure (Allegro `error`, unknown state, exchange
        failure) redirects to the failure return link.
      parameters:
      - name: code
        in: query
        required: false
        description: Authorization code from Allegro.
        schema:
          type: string
      - name: state
        in: query
        required: false
        description: OAuth state issued by `POST /v1/oauth/allegro`.
        schema:
          type: string
      - name: error
        in: query
        required: false
        description: Set by Allegro when the customer refused or the authorization failed.
        schema:
          type: string
      responses:
        '302':
          description: Redirect to the panel success or failure return link.
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          description: '`missing_code_or_state` - neither `error` nor both `code` and `state` were given.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - {}
      - tokenAuth: []
    post:
      operationId: integrationAllegroVerifyCredentials
      tags:
      - Integrations
      summary: Verify Allegro credentials
      description: Asks hermes-2 to check the given Allegro credentials without saving anything. The whole request body is
        sent to hermes-2 as the credentials object.
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationAllegroCredentials'
      responses:
        '200':
          description: Credentials accepted (empty array body).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationEmptyResponse'
        '400':
          description: Credentials rejected; `fields.token` holds the hermes-2 `general` message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - {}
      - tokenAuth: []
