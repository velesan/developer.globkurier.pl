        productsStockGrossPrice:
          type: number
        fuelSurchargeNetPrice:
          type: number
        fuelSurchargeGrossPrice:
          type: number
        fuelSurcharge:
          type: number
        fuelSurchargeStockNetPrice:
          type: number
        fuelSurchargeStockGrossPrice:
          type: number
        addonsNetPrice:
          type: number
        addonsGrossPrice:
          type: number
        discountNetPrice:
          type: number
        discountGrossPrice:
          type: number
          description: Discount from `discountCode`, gross, rounded to the precision of the currency. 0 without a code.
        packages:
          type: array
          items:
            type: object
            properties:
              productPrice:
                type: number
              fuelSurchargePrice:
                type: number
              fuelSurchargePercent:
                type: number
              discountPrice:
                type: number
              discountPercent:
                type: number
              productId:
                type: integer
                nullable: true
              productName:
                type: string
                nullable: true
              packageType:
                type: string
                nullable: true
                description: 'Package type code, e.g. PARCEL, PALLET, LONG_PARCEL.'
              packageName:
                type: string
                nullable: true
                description: Translated name of `packageType` in the caller's locale.
        addons:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              id:
                type: integer
              addonName:
                type: string
              category:
                type: string
              price:
                type: number
              priceGross:
                type: number
              currency:
                type: string
              quantity:
                type: integer
              inPrice:
                type: boolean
    OrderCreatedResponse:
      type: object
      properties:
        number:
          type: string
          example: GK000000000PL
        hash:
          type: string
