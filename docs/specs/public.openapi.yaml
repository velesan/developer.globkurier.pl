        city:
          type: string
          nullable: true
        postCode:
          type: string
          nullable: true
    PartnerProgramPartnerPage:
      type: object
      properties:
        offset:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/PartnerProgramPartner'
    PaymentDefault:
