        verificationCode:
          type: string
          description: 6-digit SMS code sent to `address.phone`. When present, replaces `gRecaptchaResponse` and marks the
            phone as verified.
          example: '123456'
        gRecaptchaResponse:
          type: string
          description: Google reCAPTCHA response or origin captcha from `GET /v1/user/captcha`. Required when `verificationCode`
            is not sent (except mass-registration callers).
        taxesArePaidAbroad:
          type: boolean
          description: Declaration of VAT settlement outside Poland; must be `true` for `COMPANY` accounts from countries
            other than Poland.
        isShortRegistration:
          type: boolean
          description: Short registration — name, surname, street, house number, city and post code become optional.
        partnerProgramNumber:
          type: string
          description: Customer number of the affiliate partner who referred the account.
        registrationLink:
          type: string
          maxLength: 100
          description: Special registration link name assigning a dedicated price list / account manager.
        grantCouponIds:
          type: array
          uniqueItems: true
          description: Mass-registration callers only — coupons to grant to the new account.
          items:
            type: integer
        SD:
          type: boolean
          description: Legacy flag, accepted and ignored.
    UserRegistrationResponse:
      type: object
      required:
