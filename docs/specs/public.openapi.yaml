  /v1/customsDocument/invoice:
    get:
      operationId: customsGetInvoiceR01
      tags:
      - Customs
      summary: Get the customs invoice of an order
      description: 'Returns the customs invoice (proforma/commercial) created for an order of the logged-in user.

        The order is given by the query parameter `orderNumber`; a missing parameter or an invoice that does not exist

        or belongs to another user returns `404` with an empty body.

        Response format is chosen by the `Accept-Type` header (forwarded by gk): `application/pdf` returns the generated

        PDF, any other value (or none) returns JSON.

        '
      x-proxied-to: /public/v2/customsDocument/invoice
      parameters:
      - name: orderNumber
        in: query
        required: true
        description: Order number the invoice was created for.
        schema:
          type: string
        example: GK000000000PL
      - name: Accept-Type
        in: header
        required: false
        description: '`application/pdf` returns the PDF; any other value or none returns JSON.'
        schema:
          type: string
          enum:
          - application/json
          - application/pdf
        example: application/json
      responses:
        '200':
          description: Invoice as JSON or PDF.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomsInvoiceV2'
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: PDF could not be generated because the invoice data is incomplete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Missing `orderNumber` or invoice not found for this user (empty body).
    post:
      operationId: customsCreateInvoiceR01
      tags:
      - Customs
      summary: Create the customs invoice of an order
      description: 'Creates a customs invoice for an order of the logged-in user''s account. Only `parameters` is read from
        the

        request - the whole `content` (parties, shipment, commodities, totals) is built from the order and its last

        customs declaration. Allowed only for orders in status IN_PROGRESS or IN_TRANSIT, one invoice per order.

        Business rule violations are returned as `400` with `general`.

        '
      x-proxied-to: /public/v2/customsDocument/invoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomsInvoiceCreateRequestV2'
            example:
              parameters:
                number: GK000000000PL
                invoiceType: proforma
      responses:
        '201':
          description: Invoice created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomsInvoiceV2'
        '400':
          description: 'Validation error (`fields`), or `general`: `Invoice for order already exists.`, `Order was not found.`,

            `Cannot build invoice for order with given status.`, `Customs was not found.`

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyErrorV2'
              examples:
                validation:
                  value:
                    fields:
                      parameters[invoiceType]: The value you selected is not a valid choice.
                exists:
                  value:
                    general:
                    - Invoice for order already exists.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/customsDocument/invoice/{id}:
    put:
      operationId: customsUpdateInvoiceR01
      tags:
      - Customs
      summary: Update the customs invoice
      description: 'Updates the editable part of an invoice `content`. `total`, `currency`, `shipment.number`,

        `shipment.totalWeightGross` and `commodities` are immutable - a different value returns `400` and the stored

        values are always kept. Fields not sent are cleared (full form submit). The order must belong to the logged-in

        user and be IN_PROGRESS or IN_TRANSIT. Response format follows `Accept-Type` like `GET`.

        '
      x-proxied-to: /public/v2/customsDocument/invoice/{id}
      parameters:
      - name: id
        in: path
        required: true
        description: Invoice ID (`id` returned when the invoice was created).
        schema:
          type: string
        example: '000000000000000000000000'
      - name: Accept-Type
        in: header
        required: false
        description: '`application/pdf` returns the PDF; any other value or none returns JSON.'
        schema:
          type: string
          enum:
          - application/json
          - application/pdf
        example: application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
