          documents:
            type: array
            description: Every document of the order with its result; present when a document was not handed over to the
              carrier (refused, left without a result by the carrier or unreadable on our side), when the documents reached
              the carrier but the pickup after the sync was not ordered, or when nothing was refused but a required document
              has not reached the carrier yet.
            items:
              $ref: '#/components/schemas/OrderTradeDocumentSyncDocument'
          carrierErrors:
            type: array
            description: Errors reported by the carrier gateway; present when it failed before confirming the documents.
              Technical messages (addresses or file paths, code, PHP or database errors, several lines or over 200
              characters) are left out, so the list may be empty.
            items:
              type: string
          pickupErrors:
            type: array
            description: The answer of the pickup step after the sync (for a carrier refusal a generic message);
              present, possibly empty, when the required documents reached the carrier but the pickup was not ordered.
              `documents` may still hold a refused optional document to correct.
            items:
              type: string
          pickup:
            description: The courier pickup the order has, ordered by this request or earlier; present only with a document
              not handed over to the carrier, and only when the order has a pickup. The courier is booked, so do not call
              `createPickup` again.
            allOf:
            - $ref: '#/components/schemas/OrderTradeDocumentSyncPickup'
    OrderTradeDocumentSyncPickup:
