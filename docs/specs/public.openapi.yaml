    ProxyErrorV2:
      type: object
      description: 'Error envelope of the v2 service, passed through unchanged by gk. Shapes in use: `fields` (field path
        =>

        message), `general` (a string, a list of strings, or `{"message": ...}` for an unsupported `Accept-Language`

        - supported: br, cz, de, en, es, fr, pl, pt, ru, cn), `error` (string or object) and `message`.

        Many v2 errors (401, 403, 404, 405) come with an empty body instead.

        '
      properties:
        fields:
          type: object
          additionalProperties:
            type: string
        general:
          oneOf:
          - type: string
          - type: array
            items:
              type: string
          - type: object
            properties:
              message:
                type: string
        error:
          oneOf:
          - type: string
          - type: object
            additionalProperties:
              type: string
        message:
          type: string
