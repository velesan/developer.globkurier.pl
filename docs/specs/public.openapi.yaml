        currency:
          type: string
          enum:
          - PLN
          - EUR
          - USD
          - GBP
          - CZK
          - HUF
          - RON
          - RUB
          default: PLN
        isDefault:
          type: boolean
          description: Default COD account for its currency.
          example: false
        subUserId:
          type: integer
          description: Create the account for this sub-account (main accounts only).
