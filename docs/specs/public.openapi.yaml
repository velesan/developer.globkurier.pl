    post:
      operationId: tradePlatformAllegroStartRefresh
      tags:
      - Trade Platforms
      summary: Start refreshing an Allegro account
      description: 'Re-authorizes an existing Allegro account whose authorization has expired or is about to expire. Works
        like

        `startAddingProcess`, but `label` is required and must identify an existing account of the token owner.

        On success the account validity is extended and the browser is redirected to `successReturnLink`; on failure to

        `failedReturnLink` with a `response` query parameter (Base64-encoded JSON errors).

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TradePlatformStartRefreshRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/TradePlatformStartRefreshRequest'
      responses:
        '302':
          description: Redirect to the platform authorization page, or to `failedReturnLink?response=...` on validation error.
          headers:
            Location:
              schema:
                type: string
      security:
      - {}
      - tokenAuth: []
