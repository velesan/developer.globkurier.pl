  /v1/user/addressBook/sender:
    post:
      operationId: userAddressBookAddSenderR03
      tags:
      - Address Book
      summary: Add a sender contact
      description: "Saves a contact in the sender address book of the authenticated account. Proxied by gk to the minotaur\
        \ v2 service; the body,\n`Content-Type`, `Accept-Language` and `X-Auth-Token` are forwarded unchanged and the upstream\
        \ status/body is returned as is.\n\nRules enforced by v2:\n- `contact.countryId` is resolved by country id, Polish\
        \ name, English name or zone code (in that order).\n- If `street` is sent without `houseNumber`, the street is split\
        \ into street / house number / apartment number\n  (country-specific rules); an unsplittable value returns `400` with\
        \ `general: [\"Address format is unacceptable.\"]`.\n- The phone number is normalised for the contact's country before\
        \ validation.\n- A contact identical to an existing one is silently skipped — the call still returns `204`.\n- JSON\
        \ (`application/json`) and form (`application/x-www-form-urlencoded`, `contact[name]=...`) bodies are both accepted.\n"
      x-proxied-to: /public/v2/user/addressBook/sender
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressBookCreateRequestV2'
      responses:
        '204':
          description: Contact saved (or an identical contact already existed).
        '400':
          description: Validation error, e.g. `{"fields":{"contact[countryId]":"This value is not valid."}}` or `{"fields":{"contact[phoneNumber]":"..."}}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProxyErrorV2'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: userAddressBookEditSenderR03
      tags:
      - Address Book
      summary: Edit a sender contact
      description: 'Updates a contact of the authenticated account''s sender address book. Partial update: every field that
        is omitted or

        empty keeps its stored value, except `default` and `favorite`, where an empty string returns `400`. `contact.id` must
        be a string of digits (`ctype_digit` check). `countryId` here is a
        country id only

        (no name lookup). The same street splitting as on create applies; an unsplittable street returns `400` with `general`
        as a string.

        '
      x-proxied-to: /public/v2/user/addressBook/sender
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressBookUpdateRequestV2'
      responses:
        '204':
          description: Contact updated.
        '400':
          description: Validation error, e.g. `{"fields":{"id":"This value does not exist."}}` (unknown id or contact of another
            account).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProxyErrorV2'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: userAddressBookDeleteSenderR03
      tags:
      - Address Book
      summary: Delete a sender contact
      description: Deletes a contact from the authenticated account's sender address book. The id is passed in the query string.
      x-proxied-to: /public/v2/user/addressBook/sender
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: id
        in: query
        required: true
        description: Contact id (digits only).
        schema:
          type: string
          pattern: ^\d+$
          example: '123'
      responses:
        '204':
          description: Contact deleted.
        '400':
          description: '`id` missing (`This value should not be blank.`), not a natural number, or not found for this account
            (`This value does not exist.`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProxyErrorV2'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/user/addressBook/sender/import:
    post:
      operationId: userAddressBookImportSendersR03
      tags:
      - Address Book
      summary: Bulk import sender contacts from a file
      description: "Imports many sender contacts at once from a base64-encoded file sent in the JSON body. Only `fileType=csv`\
        \ is supported.\n\nFile rules (v2):\n- The decoded content's detected MIME type must be one of `text/csv`, `text/plain`,\
        \ `application/csv`, `text/x-csv`,\n  `application/vnd.ms-excel`, `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`;\
        \ maximum 5 MB.\n- The first line is the header with the contact field names (`name`, `email`, `street`, `houseNumber`,\
        \ `apartmentNumber`,\n  `postCode`, `city`, `countryId`, `contactPerson`, `phone`, `tin`, optional `shortName` of up to 30 characters); delimiter `;` or `,` (not\
        \ both); UTF-8.\n- Every row is validated and saved like `POST /v1/user/addressBook/sender`. Rows are saved one by\
        \ one, so on the first invalid\n  row the call returns `400` and the rows before it stay saved.\n"
      x-proxied-to: /public/v2/user/addressBook/sender/import
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: fileType
        in: query
        required: true
        description: Format of the file.
        schema:
          type: string
          enum:
          - csv
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressBookImportRequestV2'
      responses:
        '204':
          description: All rows imported.
        '400':
          description: '`fileType` missing/unsupported (`fields.fileType`), no file / unsupported file type / file too large
            / empty row / wrong encoding

            (`general: ["..."]`), or a row failed contact validation (`fields.contact[<field>]`).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProxyErrorV2'
        '401':
          $ref: '#/components/responses/Unauthorized'
