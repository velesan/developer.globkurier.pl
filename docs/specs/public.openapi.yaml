  /v1/tradePlatform/allegro/account/add:
    get:
      operationId: tradePlatformAllegroAccountCallback
      tags:
      - Trade Platforms
      summary: Allegro authorization callback
      description: 'OAuth return address registered at Allegro; not called directly by clients. Reads the process cookies
        set by

        `startAddingProcess` / `startRefreshProcess`, exchanges `code` for tokens and creates or refreshes the account,

        then redirects to `successReturnLink`, or to `failedReturnLink` with a `response` query parameter holding

        Base64-encoded JSON errors.

        '
      parameters:
      - name: code
        in: query
        required: false
        description: Authorization code returned by Allegro (missing when access was denied).
        schema:
          type: string
          maxLength: 400
      responses:
        '302':
          description: Redirect to the success or failed return link.
          headers:
            Location:
              schema:
                type: string
      security:
      - {}
