              description:
                type: string
              required:
                type: boolean
    OrderDraftSendRequest:
      type: object
      required:
      - paymentId
      - productTemplateId
      additionalProperties: false
      properties:
        orderDraftsIds:
          type: array
          maxItems: 100
          description: Required unless `importFileId` is given.
          items:
            type: integer
        importFileId:
          type: integer
          description: Send all active drafts of this CSV import instead of `orderDraftsIds`.
        paymentId:
          type: integer
          enum:
          - 3
          - 4
          - 9
          description: 3 prepaid, 4 deferred bank transfer, 9 collective prepaid.
        productTemplateId:
          type: integer
          description: Product template of the caller.
        receiverType:
          type: string
          enum:
          - PERSON
          - COMPANY
        pickupDate:
          type: string
          format: date
          description: Working day, not in the past.
        customsDeclarationTemplateId:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
          description: Saved customs declaration template to apply.
    OrderDraftMarketplaceSendRequest:
      type: object
      required:
      - orderDraftsIds
      - paymentId
      - idempotencyKey
      additionalProperties: false
      properties:
        orderDraftsIds:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: integer
        paymentId:
          type: integer
          enum:
          - 4
          - 9
          description: 4 deferred bank transfer, 9 collective prepaid.
        idempotencyKey:
          type: string
          format: uuid
        productTemplateId:
          type: integer
          description: Required unless one draft is sent with `shipment`.
        shipment:
          type: object
          additionalProperties: false
          required:
          - length
          - width
          - height
          - weight
          description: Parcel typed by hand; single-draft batches only.
          properties:
            length:
              type: number
              exclusiveMinimum: true
              minimum: 0
            width:
              type: number
              exclusiveMinimum: true
              minimum: 0
            height:
              type: number
              exclusiveMinimum: true
              minimum: 0
            weight:
              type: number
              exclusiveMinimum: true
              minimum: 0
            quantity:
              type: number
              exclusiveMinimum: true
              minimum: 0
            content:
              type: string
              minLength: 2
              maxLength: 255
        receiverType:
          type: string
          enum:
          - PERSON
          - COMPANY
        pickupDate:
          type: string
          format: date
          description: Accepted for form compatibility; Allegro arranges the pickup itself.
    OrderDraftBatchResult:
      type: object
      description: Draft id => result. A placed draft holds the `POST /v1/order` success body; a failed one an Error envelope
        whose `errors[]` items also carry `column` and `columnLabel`.
      additionalProperties:
        type: object
        additionalProperties: true
    PartnerProgramProvision:
      type: object
