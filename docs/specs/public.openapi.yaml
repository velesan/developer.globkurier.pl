      summary: Disconnect an Allegro integration
      description: Removes the caller's Allegro integration from hermes-2 (`id` = hermes-2 UUID). The GlobKurier trade platform
        account shared by all of the customer's Allegro integrations (and its imported drafts) is kept; only when the integration
        is a copy of an old-hermes account is that legacy account deleted too, so the old import stops. Ownership is checked
