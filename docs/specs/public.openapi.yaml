        orderStatus:
          type: string
          nullable: true
          description: Shipment status key of that order.
        importFileId:
          type: integer
          nullable: true
        draftOriginName:
          type: string
        draftOriginId:
          type: integer
        tradePlatformAccountId:
          type: integer
        isActive:
          type: boolean
        userId:
          type: integer
        senderAddress:
          $ref: '#/components/schemas/OrderDraftAddress'
        receiverAddress:
          $ref: '#/components/schemas/OrderDraftAddress'
        senderPoint:
          $ref: '#/components/schemas/OrderDraftPoint'
        receiverPoint:
          $ref: '#/components/schemas/OrderDraftPoint'
        shipment:
          type: object
          properties:
            productId:
              type: integer
            length:
              type: integer
            width:
              type: integer
            height:
              type: integer
            weight:
              type: number
            quantity:
              type: integer
        content:
          type: string
        paymentId:
          type: integer
        discountCode:
          type: string
        referenceNumber:
          type: string
        description:
          type: string
        purpose:
          type: string
        declaredValue:
          type: number
        addons:
          type: array
