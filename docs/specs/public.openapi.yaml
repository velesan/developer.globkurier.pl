      summary: Edit a receiver contact
      description: 'Updates a contact of the authenticated account''s receiver address book. Partial update: omitted or empty
        fields keep their

        stored values, except `default` and `favorite`, where an empty string returns `400`. `contact.id` must be a string of
        digits; `countryId` is a country id only.

        '
      x-proxied-to: /public/v2/user/addressBook/receiver
