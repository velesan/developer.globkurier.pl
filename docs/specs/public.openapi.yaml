  /v1/order/group:
    get:
      operationId: orderGroupGet
      tags:
      - Order Groups
      summary: Get order group
      description: Details of one order group of the account, with its member orders and their total weight.
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Group details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderGroupDetails'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Group not found in the account (empty body).
    post:
      operationId: orderGroupCreate
      tags:
      - Order Groups
      summary: Create order group
      description: 'Groups orders of the account (identified by hashes) so they can be sent together to the logistics warehouse
        as one collective shipment

        (created later with `orderGroupId` in `POST /v1/order`). Orders that cannot be grouped are rejected with a general
        `400` error.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - orders
              - packagingType
              properties:
                orders:
                  type: array
                  items:
                    type: string
                  description: Hashes of the orders to group.
                packagingType:
                  $ref: '#/components/schemas/OrderGroupPackagingType'
                name:
                  type: string
                  maxLength: 80
      responses:
        '201':
          description: Group created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: orderGroupUpdate
      tags:
      - Order Groups
      summary: Update order group
      description: 'Changes the name and/or packaging type, or attaches the collective shipment order (`masterOrderId`).

        A master order can be attached only once, only to a non-empty group, and only an order of the account. At least one
        change is required.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              properties:
                id:
                  type: integer
                masterOrderId:
                  type: integer
                  description: ID of the order carrying the whole group.
                packagingType:
                  $ref: '#/components/schemas/OrderGroupPackagingType'
                name:
                  type: string
                  maxLength: 80
                  nullable: true
      responses:
        '204':
          description: Updated.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Group not found in the account (empty body).
    delete:
      operationId: orderGroupDelete
      tags:
      - Order Groups
      summary: Delete order group
      description: Dissolves the group (soft delete); the member orders stay untouched.
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Group not found in the account (empty body).
  /v1/order/group/byOrder:
    get:
      operationId: orderGroupGetByOrder
