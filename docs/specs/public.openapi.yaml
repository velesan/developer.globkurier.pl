          type: string
      - name: filters[phrase]
        in: query
        required: false
        description: Search phrase (legacy form, used only when `phrase` is empty).
        schema:
          type: string
      - name: countryId
        in: query
        required: false
        description: Return only contacts from this country. A non-integer value returns `404`.
        schema:
          type: integer
      - name: default
        in: query
        required: false
        description: '`true`/`1` returns only the default contact, `false`/`0` only the others (case-insensitive); omitted
          or empty returns all. Also accepted as `filters[default]` (used when `default` is absent or empty). Any other value
          returns `400` with `fields.default`.'
        schema:
          type: boolean
      - name: filters[default]
        in: query
        required: false
        description: Default contact filter (legacy form, used only when `default` is absent or empty); same values as `default`.
        schema:
