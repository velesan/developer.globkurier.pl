  /v1/user:
    post:
      operationId: userRegister
      tags:
      - User
      summary: Register a new customer account
      description: "Creates a customer account and returns its customer number together with an active authorization token.\n\
        \nHuman check — exactly one is required (unless the caller is a mass-registration partner):\n- `verificationCode`:\
        \ 6-digit SMS code previously sent with `POST /v1/user/verificationCode` to `address.phone`.\n  When present it takes\
        \ precedence and `gRecaptchaResponse` is ignored. Only this path marks the phone as verified.\n- otherwise `gRecaptchaResponse`:\
        \ a Google reCAPTCHA response or a one-shot origin captcha obtained from\n  `GET /v1/user/captcha`. The captcha is\
        \ spent only when the rest of the payload is valid.\n\nAnonymous callers register themselves. An authenticated caller\
        \ may register accounts only when its account has\nmass registration enabled (otherwise `401`); such accounts get\
        \ the creator's default guardian and price group,\nmay pass `grantCouponIds`, skip the human check and are limited\
        \ per hour (`400` with a plain-text message).\n\n`agreements` is a map of agreement code → boolean; the set of codes\
        \ (and which are required / must be `true`)\ncomes from the active registration agreements (see the agreements endpoint).\
        \ Unknown codes are rejected.\nActive dashboard agreements accepted by default are added automatically when omitted.\n\
        For `COMPANY` accounts outside Poland `taxesArePaidAbroad` must be `true`. For EU companies the TIN is checked\nagainst\
        \ VIES/GUS and `companyName` must match the registry name.\n`registrationLink` (special price-group link) assigns\
        \ its price group/guardian and, if the link carries a TIN,\nthe TIN must match it. `partnerProgramNumber` attaches\
        \ the account to an affiliate partner.\n"
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
            example:
              password: Secret123
              address:
                type: PERSON
                name: Jan
                surname: Kowalski
                street: Testowa
                houseNumber: '1'
                apartmentNumber: '2'
                postCode: 00-001
                city: Warszawa
                countryId: 1
                phone: '+48500000000'
                email: jan.kowalski@example.com
              agreements:
                processingPersonalData: true
                receiveElectronicBills: true
              verificationCode: '123456'
      responses:
        '201':
          description: Account created; token is already authorized for the new account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistrationResponse'
              example:
                number: '123'
                token: 0
        '400':
          description: Validation error (`Error` JSON), or plain text `Limit of created accounts per hour reached.` for mass-registration
            callers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
            text/plain:
              schema:
                type: string
        '401':
          description: Caller is authenticated but its account is not allowed to register other accounts.
      security:
      - {}
      - tokenAuth: []
    put:
      operationId: userUpdateProfile
      tags:
      - User
      summary: Update the current user's profile
      description: "Updates the logged-in account's data: address, agreements, default agreements, invoice currency and\n\
        alternative e-mails for invoices / labels. Returns `204`.\n\n- Main accounts must send `address`; sub-accounts send\
        \ `subUserAddress` instead (`address` is ignored for them).\n- `address.type` and `address.countryId` cannot be changed\
        \ once the account type is set; a TIN already on the\n  account cannot be changed either.\n- Changing `address.phone`\
        \ requires `verificationCode` (SMS code sent to the new number). Sending a code with the\n  unchanged number verifies\
        \ the current phone. A phone change without a code clears the verified flag.\n- `currency` defaults to `PLN` when\
        \ omitted — the account's invoice currency is overwritten on every call.\n- `cashOnDelivery` is validated but no longer\
        \ stored here; manage COD bank accounts with `/v1/user/cod`.\n- Unknown top-level fields are ignored.\n"
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdateRequest'
            example:
              address:
                type: PERSON
                name: Jan
                surname: Kowalski
                street: Testowa
                houseNumber: '1'
                postCode: 00-001
                city: Warszawa
                phone: '+48500000000'
                email: jan.kowalski@example.com
              currency: PLN
              invoicesToOtherEmail: invoices@example.com
      responses:
        '204':
          description: Profile saved.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/user/apiQuotaExemption:
    get:
      operationId: userApiQuotaExemption
      tags:
      - User
      summary: Status of the exemption from the hourly quota on product search and addons
      description: 'GET /v1/products and GET /v1/product/addons serve a person picking a product and its addons, so a
        signed-in account may call them up to 500 / 1000 times per clock hour. An account whose order placed through an
        integration (any order origin but the GlobKurier website and panels, the default API origin included) was
        handed to the carrier - granted within about 15 minutes of the carrier taking it - or that customer service
        exempted skips that hourly quota (the per-second limit stays). `PENDING` means a request reached customer
        service within the last day. Main accounts only; sub-accounts share the main account''s exemption.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The exemption status of the main account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiQuotaExemptionStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: userApiQuotaExemptionRequest
      tags:
      - User
      summary: Ask to be exempted from the hourly quota on product search and addons
      description: 'Files a request for customer service, who will contact the account and grant the exemption to an
        agreed integration (202 PENDING); `description` is required - what is integrated and the expected number of
        calls per hour (at least 20 characters besides leading and trailing spaces). For an account that has not shipped
        yet: the first shipment sent through an integration grants the exemption on its own. An account already
        exempted gets 200 GRANTED. A request is sent at most once a day; asking again meanwhile
        answers 202 PENDING without requiring `description`. Main accounts only. Prefer `POST /v1/order/bestPrice` for pricing
        shipments from an integration.

        '
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                  minLength: 20
                  maxLength: 2000
                  description: What is integrated and the expected traffic. Required unless the account is already exempted or its request is pending.
      responses:
        '200':
          description: The account is already exempted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiQuotaExemptionStatus'
        '202':
          description: The request went to customer service.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiQuotaExemptionStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: The request could not be sent to customer service; try again later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/user/accountManager:
    get:
      operationId: userGetAccountManager
