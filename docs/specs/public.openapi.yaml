  /v1/user/addressBook/receiver:
    post:
      operationId: userAddressBookAddReceiverR03
      tags:
      - Address Book
      summary: Add a receiver contact
      description: 'Saves a contact in the receiver address book of the authenticated account. Same contract and rules as

