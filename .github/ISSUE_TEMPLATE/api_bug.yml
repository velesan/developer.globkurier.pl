name: API bug
description: The API behaves differently than documented.
labels: [api-bug]
body:
  - type: markdown
    attributes:
      value: |
        Issues are public. Remove tokens (`X-Auth-Token`), passwords and personal data of senders and recipients.
        Security vulnerabilities: see SECURITY.md, not this form.
  - type: input
    id: endpoint
    attributes:
      label: Endpoint
      placeholder: POST /v1/order
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [Production (api.globkurier.pl), Test (test.api.globkurier.pl)]
    validations:
      required: true
  - type: input
    id: time
    attributes:
      label: Time of the request (with time zone)
      placeholder: 2026-11-03 12:30 CET
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request (without token)
      render: json
  - type: textarea
    id: response
    attributes:
      label: Response (status code and body)
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: Link to the documentation that describes it, if any.
    validations:
      required: true
